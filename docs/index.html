</header>
<main>
  <div class="controls">
    <div class="group"><label>API</label><div class="seg" id="api"></div></div>
    <div class="group"><label>Тип</label><div class="seg" id="variant"></div></div>

    </div>
  </div>

    <span>Цена в <b class="tip" title="Стоимость в одной скалярной FMA (a*b+c) на том же GPU: «sin = 8» — sin стоит как 8 умножений-сложений">FMA</b></span>

    <span class="muted">клик по строке — цена на каждом GPU</span>

<script>
"use strict";
const ARCH_ORDER = ["Arm 5th Generation", "Valhall", "Bifrost"];
const GROUPS = {
  "Arm 5th Generation": { name: "Новые", years: "5th Gen · 2023+", cls: "g-new" },
  "Valhall":            { name: "Актуальные", years: "Valhall · 2019–2022", cls: "g-cur" },
  "Bifrost":            { name: "Старые", years: "Bifrost · 2016–2018", cls: "g-old" },
};
// year, segment, example chips (where known)
const GPU_INFO = {
  "Mali G2": [2026, "флагман", ""], "Mali G1": [2025, "флагман", "Dimensity 9500"],
  "Immortalis-G925": [2024, "флагман", "Dimensity 9400"], "Mali-G725": [2024, "верхний средний", ""],
  "Mali-G625": [2024, "средний", ""], "Immortalis-G720": [2023, "флагман", "Dimensity 9300"],
  "Mali-G720": [2023, "верхний средний", "Dimensity 8400"], "Mali-G620": [2023, "средний", ""],
  "Immortalis-G715": [2022, "флагман", "Dimensity 9200"], "Mali-G715": [2022, "флагман", "Tensor G3, G4 (Pixel 8, 9)"],
  "Mali-G615": [2022, "средний", "Dimensity 8300, 7300"], "Mali-G710": [2021, "флагман", "Dimensity 9000, Tensor G2 (Pixel 7)"],
  "Mali-G610": [2021, "средний", "Dimensity 8100, 8200"], "Mali-G510": [2021, "бюджетный", ""],
  "Mali-G310": [2021, "начальный", ""], "Mali-G78AE": [2021, "автомобильный", ""],
  "Mali-G78": [2020, "флагман", "Exynos 2100 (S21), Kirin 9000, Tensor G1 (Pixel 6)"],
  "Mali-G68": [2020, "средний", "Dimensity 900, 1080, Exynos 1280"],
  "Mali-G77": [2019, "флагман", "Exynos 990 (S20), Dimensity 1000, 1200"],
  "Mali-G57": [2019, "бюджетный / средний", "Helio G99, Dimensity 700, 810"],
  "Mali-G76": [2018, "флагман", "Exynos 9820 (S10), Kirin 980, Helio G90T"],
  "Mali-G52": [2018, "бюджетный", "Helio G85, G88, Exynos 850"],
  "Mali-G31": [2018, "начальный", ""], "Mali-G72": [2017, "флагман", "Exynos 9810 (S9), Kirin 970, Helio P60"],
  "Mali-G71": [2016, "флагман", "Exynos 8895 (S8), Kirin 960"], "Mali-G51": [2016, "бюджетный", "Kirin 710"],
};
const VARIANTS = ["float", "half", "float4", "half4"];
const COL_SHORT = { "Arm 5th Generation": "5th Gen", "Valhall": "Valhall", "Bifrost": "Bifrost" };
const S = { api: "GLES", variant: "float", q: "", sort: null, cols: ["Arm 5th Generation", "Valhall", "Bifrost"] };
let D = null;

function parseCSV(text) {
  const out = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(f); f = ""; if (row.length > 1 || row[0] !== "") out.push(row); row = [];
    } else f += c;
  }
  if (f !== "" || row.length) { row.push(f); out.push(row); }
  const h = out.shift();
  return out.map(r => Object.fromEntries(h.map((k, i) => [k, r[i] ?? ""])));
}

function ingest(text) {
  const rows = parseCSV(text.replace(/^﻿/, "")).filter(r => ARCH_ORDER.includes(r.arch));
  const num = ["cycles", "rel_fma", "fma", "cvt", "sfu", "fp16_pct", "work_regs_1call", "uniform_regs_1call", "alu_fma", "rel_short", "rel_tex"];
  for (const r of rows) for (const k of num) r[k] = r[k] === "" ? null : +r[k];
  const gpuMap = new Map();
  for (const r of rows) if (!gpuMap.has(r.gpu)) gpuMap.set(r.gpu, { name: r.gpu, arch: r.arch, malioc: r.malioc });
  const year = g => (GPU_INFO[g.name] || [0])[0];
  const gpus = [...gpuMap.values()].sort((a, b) =>
    ARCH_ORDER.indexOf(a.arch) - ARCH_ORDER.indexOf(b.arch) || year(b) - year(a));
  const funcs = [], seen = new Set();
  for (const r of rows) if (!seen.has(r.func)) { seen.add(r.func); funcs.push({ id: r.func, hlsl: r.hlsl, category: r.category, note: r.note, unit: r.unit || "FMA" }); }
  const idx = new Map();
  for (const r of rows) idx.set(`${r.api}|${r.variant}|${r.func}|${r.gpu}`, r);
  D = { rows, gpus, funcs, idx };
  const mv = [...new Set(rows.map(r => r.malioc))].join(", ");
  const n = funcs.length, n10 = n % 10, n100 = n % 100;
  const word = n10 === 1 && n100 !== 11 ? "функция" : n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14) ? "функции" : "функций";
  document.getElementById("sub").textContent =
    `Mali Offline Compiler ${mv} · ${gpus.length} GPU · ${n} ${word} · фрагментный шейдер · OpenGL ES и Vulkan`;
  buildControls(); render();
}

// tooltips of the switches (the reference has more)
const SEG_TIPS = {
  GLES: "Цены в OpenGL ES (GLSL)", Vulkan: "Цены в Vulkan (SPIR-V)",
  float: "float (highp): векторы — float3, матрицы — float3x3", half: "half (mediump): векторы — half3, матрицы — half3x3",
  float4: "float на 4 компонентах: float4 и float4x4", half4: "half на 4 компонентах: half4 и half4x4",
};
function seg(id, opts, key) {
  const el = document.getElementById(id); el.innerHTML = "";
  for (const [v, label] of opts) {
    const b = document.createElement("button"); b.textContent = label; b.className = S[key] === v ? "on" : "";
    if (SEG_TIPS[v]) b.title = SEG_TIPS[v];
    b.onclick = () => { S[key] = v; save(); buildControls(); render(); };
    el.appendChild(b);
  }
}
function buildControls() {
  seg("api", [["GLES", "OpenGL ES"], ["Vulkan", "Vulkan"]], "api");
  seg("variant", VARIANTS.map(v => [v, v]), "variant");
  const el = document.getElementById("cols"); el.innerHTML = "";
  for (const a of ARCH_ORDER.filter(a => D.gpus.some(g => g.arch === a))) {
    const b = document.createElement("button"); b.textContent = COL_SHORT[a]; b.className = S.cols.includes(a) ? "on" : "";
    b.title = `${GROUPS[a].name} · ${GROUPS[a].years}`;
    b.onclick = () => { S.cols = S.cols.includes(a) ? S.cols.filter(x => x !== a) : [...S.cols, a]; save(); buildControls(); render(); };
    el.appendChild(b);
  }
}

const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const fmt = v => v == null ? "–" : v >= 10 ? v.toFixed(0) : v >= 1 ? v.toFixed(1) : v === 0 ? "0" : v.toFixed(2);
const tier = v => v == null ? "" : v <= 1.5 ? "cheap" : v <= 10 ? "medium" : "heavy";
const TIER_RU = { cheap: "дешёвая", medium: "средняя", heavy: "тяжёлая" };
function heat(v) {
  if (v == null) return "";
  const t = Math.min(1, Math.log2(1 + v) / Math.log2(1 + 64));
  return `background: hsla(${(145 - 145 * t).toFixed(0)}, 55%, var(--heat-l), calc(var(--heat-a) * ${(0.35 + 0.65 * t).toFixed(2)}))`;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const short = n => n.replace("Mali-", "").replace("Mali ", "").replace("Immortalis-", "Imm-");
function gpuTitle(g) {
  const [y, segm, ex] = GPU_INFO[g.name] || ["?", "", ""];
  return `${g.name} · ${g.arch === "Arm 5th Generation" ? "5th Gen" : g.arch} · ${y}` + (segm ? ` · ${segm}` : "") + (ex ? `\nНапример: ${ex}` : "");
}
const get = (fid, g, v = S.variant, api = S.api) => D.idx.get(`${api}|${v}|${fid}|${g}`);

function stats(fid) {
  const vals = [], alus = [], texs = [], shorts = [], bounds = {}; let r0 = null, anyShort = false;
  for (const g of D.gpus) {
    const r = get(fid, g.name); if (!r || r.rel_fma == null) continue;
    r0 = r0 || r; vals.push(r.rel_fma); bounds[r.bound] = (bounds[r.bound] || 0) + 1;
    if (r.alu_fma != null) alus.push(r.alu_fma);
    if (r.rel_tex != null) texs.push(r.rel_tex);
    // empty rel_short = the shortest path costs the same, so the median covers the same GPUs as med
    shorts.push(r.rel_short ?? r.rel_fma); anyShort = anyShort || r.rel_short != null;
  }
  const bound = Object.entries(bounds).filter(e => e[0] !== "-").sort((a, b) => b[1] - a[1]).map(e => e[0])[0] || "–";
  const med = median(vals), sh = anyShort ? median(shorts) : null;
  return { med, min: vals.length ? Math.min(...vals) : null, max: vals.length ? Math.max(...vals) : null,
           alu: median(alus), tex: median(texs), anyShort, short: sh != null && med - sh > Math.max(0.05, 0.02 * med) ? sh : null,
           typ: r0 ? r0.type : "", hexpr: r0 ? (r0.hlsl_expr || r0.glsl) : "", glsl: r0 ? r0.glsl : "", bound };
}
// malioc's shortest path: a skipped user branch, or a fast path inside the compiled code (integer division)
const isBranch = f => f.category === "Ветвления";
const isTex = f => f.category === "Текстуры";
const BOUND_RU = { FMA: "FMA", CVT: "CVT", SFU: "SFU", A: "ALU", TEX: "TEX" };
const BOUND_HELP = {
  FMA: "FMA — блок умножения и сложения (+, *, mad, lerp, dot), на G615/G715 и 5th Gen также округления и (int)x",
  CVT: "CVT — блок сравнений и выбора (min/max, clamp, step, ?:) и целочисленного сложения, на G57–G710 также округления, на G615/G715 и 5th Gen — сдвиги",
  SFU: "SFU — блок специальных функций (rcp, sqrt, exp2, log2, sin/cos), деления и целочисленного умножения, на G57–G710 также сдвиги",
  A: "ALU — у Bifrost malioc не разделяет блоки",
  TEX: "TEX — текстурный блок",
  "—": "Бесплатно: компилятор встраивает операцию в соседнюю инструкцию",
};

function render() {
  const wrap = document.getElementById("wrap");
  const q = S.q.trim().toLowerCase();
  const funcs = D.funcs.filter(f => !q || [f.id, f.hlsl, f.category].some(s => s.toLowerCase().includes(q)));
  if (!funcs.length) { wrap.innerHTML = `<div class="empty">Ничего не найдено</div>`; return; }
  const allArchs = ARCH_ORDER.filter(a => D.gpus.some(g => g.arch === a));
  const archs = allArchs.filter(a => S.cols.includes(a));
  const st = new Map(funcs.map(f => {
    const s = stats(f.id);
    s.grp = {};
    for (const a of allArchs) s.grp[a] = median(D.gpus.filter(g => g.arch === a).map(g => get(f.id, g.name)?.rel_fma).filter(v => v != null));
    return [f.id, s];
  }));
  const gmax = Math.max(...[...st.values()].map(s => s.max ?? 0), 1e-9);

  let order = funcs;
  if (S.sort) {
    const { key, dir } = S.sort;
    const val = f => key === "med" ? st.get(f.id).med : key === "fn" ? f.hlsl.toLowerCase() : st.get(f.id).grp[key];
    order = [...funcs].sort((a, b) => {
      const va = val(a), vb = val(b);
      if (va == null) return 1; if (vb == null) return -1;
      return (va > vb ? 1 : va < vb ? -1 : 0) * dir;
    });
  }
  const arrow = k => S.sort && S.sort.key === k ? (S.sort.dir > 0 ? " ▲" : " ▼") : "";
  const ncol = 7 + archs.length;
  let h = `<table class="main"><thead><tr class="n">` +
    `<th class="l fn sortable" data-k="fn">Функция${arrow("fn")}</th><th class="l" title="float/half: векторы на float3, матрицы 3x3; float4/half4 — на 4. half = mediump">Тип</th><th class="l" title="дешёвая ≤ 1.5 FMA, средняя ≤ 10, тяжёлая > 10">Уровень</th>` +
    `<th class="sortable" data-k="med" title="Медиана по всем GPU">Медиана${arrow("med")}</th><th class="l" title="От самого дешёвого до самого дорогого GPU">Разброс по GPU</th>`;
  archs.forEach((a, i) => {
    const G = GROUPS[a];
    h += `<th class="grpc sortable ${G.cls} ${i === 0 ? "gl" : ""}" data-k="${a}" title="Медиана по GPU группы: ${G.years}">${G.name}${arrow(a)}<small>${G.years}</small></th>`;
  });
  h += `<th class="l gl" title="Более дешёвая формула с близкой точностью: ×N — во сколько раз быстрее">Аппроксимация</th><th class="l note" title="Особенности замера этой функции">Заметка</th></tr></thead><tbody>`;

  let lastCat = null;
  for (const f of order) {
    const s = st.get(f.id);
    if (!S.sort && f.category !== lastCat) {
      const un = isTex(f) ? `<span class="catnote"> — тоже в FMA. Текстурный блок работает параллельно с математикой. «× tex2D» — во сколько раз дольше обычной выборки. Замер — билинейная 32-битная текстура, трилинейная и анизотропная дороже.</span>` : "";
      h += `<tr class="cat"><td colspan="${ncol}">${esc(f.category)}${un}</td></tr>`;
      lastCat = f.category;
    }
    const t = tier(s.med, f.unit);
    const lo = s.min != null ? s.min / gmax * 100 : 0, hi = s.max != null ? s.max / gmax * 100 : 0;
    const ax = apxFor(f.id);
    const axBest = ax.map(a => ({ a, k: apxSpeed(a).all || 0 })).sort((p, q) => q.k - p.k)[0];
    const axBtn = axBest ? `<button class="apx" data-apx="${f.id}" title="${ax.length} вар.: ${esc(ax.map(a => a.name).join(", "))}. Лучший — ${esc(axBest.a.name)}">Аппроксимация${axBest.k ? ` ×${fmt(axBest.k)}` : ""}</button>` : "";
    h += `<tr data-f="${f.id}"><td class="l fn">${esc(f.hlsl)}<div class="code">${esc(s.hexpr)}</div></td>` +
      `<td class="l code">${esc(s.typ)}</td><td class="l">${t ? `<span class="tier ${t}" title="${{cheap: "до 1.5 FMA", medium: "1.5–10 FMA", heavy: "больше 10 FMA"}[t] || ""}">${TIER_RU[t]}</span>` : ""}</td>` +
      `<td class="heat big" style="${heat(s.med)}">${fmt(s.med)}</td>` +
      `<td class="l"><span class="range"><i style="left:${lo}%;width:${Math.max(1, hi - lo)}%"></i></span> <span class="code">${fmt(s.min)}–${fmt(s.max)}</span></td>`;
    archs.forEach((a, i) => { const v = s.grp[a]; h += `<td class="heat ${i === 0 ? "gl" : ""}" style="${heat(v)}">${fmt(v)}</td>`; });
    const notes = [];
    if (isTex(f)) notes.push(`${fmt(s.tex)} × tex2D` + (s.alu ? `, +${fmt(s.alu)} FMA на uv` : ""));
    else if (s.short != null) notes.push(`${isBranch(f) ? "Ветка пропущена" : "Короткий путь"}: ${fmt(s.short)}`);
    if (f.note) notes.push(f.note);
    h += `<td class="l gl apxc">${axBtn}</td><td class="note">${esc(notes.join(". "))}</td></tr>`;
  }
  wrap.innerHTML = h + `</tbody></table>`;
  wrap.querySelectorAll("th.sortable").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    S.sort = S.sort && S.sort.key === k ? (S.sort.dir === 1 ? { key: k, dir: -1 } : null) : { key: k, dir: 1 };
    render();
  });
  wrap.querySelectorAll("tbody tr[data-f]").forEach(tr => tr.onclick = () => openDrawer(tr.dataset.f));
  wrap.querySelectorAll("button.apx").forEach(b => b.onclick = e => { e.stopPropagation(); openApprox(b.dataset.apx); });
}

// --- approximations (docs/approx.js, built by bench/approx/build_approx.py; malioc Vulkan only)
const APX = window.MALI_APPROX || [];
const apxFor = fid => APX.filter(a => a.func === fid);
const fmtE = e => e >= 0.01 ? e.toFixed(3) : e.toExponential(1).replace("e-", "·10⁻").replace(/⁻(\d+)/, (m, d) => "⁻" + [...d].map(c => "⁰¹²³⁴⁵⁶⁷⁸⁹"[c]).join(""));
// speedup = builtin / approximation cost; per architecture group and over all GPUs
function apxSpeed(a, v = S.variant) {
  const by = {}, all = [];
  for (const [g, c] of Object.entries(a.cost)) {
    const [b, x] = c[v] || []; if (b == null || x == null || x <= 0) continue;
    const grp = c.arch;
    (by[grp] = by[grp] || { b: [], x: [], k: [] });
    by[grp].b.push(b); by[grp].x.push(x); by[grp].k.push(b / x); all.push(b / x);
  }
  return { by, all: median(all) };
}

// values: reference sin vs approximation on a range wider than the valid one
function valChart(a) {
  const W = 640, H = 220, L = 34, R = 10, T = 10, B = 26, YM = 1.5;
  const pts = a.plot, [x0, x1] = a.plot_domain;
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R), sy = y => T + (YM - y) / (2 * YM) * (H - T - B);
  const step = Math.PI * (x1 - x0 > 20 ? 2 : 1), ticksX = [];
  for (let t = Math.ceil(x0 / step - 1e-9) * step; t <= x1 + 1e-9; t += step) ticksX.push(t);
  const piLabel = t => { const k = Math.round(t / Math.PI); return k === 0 ? "0" : (k < 0 ? "−" : "") + (Math.abs(k) === 1 ? "" : Math.abs(k)) + "π"; };
  const line = (i, color, dash) => `<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"${dash ? ` stroke-dasharray="${dash}"` : ""} clip-path="url(#clip-${a.id})" points="${pts.map(p => `${sx(p[0]).toFixed(1)},${sy(Math.max(-9, Math.min(9, p[i]))).toFixed(1)}`).join(" ")}"/>`;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="sin и ${esc(a.name)}"><defs><clipPath id="clip-${a.id}"><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"/></clipPath></defs>`;
  if (a.valid) s += `<rect x="${sx(a.valid[0])}" y="${T}" width="${sx(a.valid[1]) - sx(a.valid[0])}" height="${H - T - B}" fill="color-mix(in srgb, var(--cheap) 10%, transparent)"/>` +
    `<text x="${(sx(a.valid[0]) + sx(a.valid[1])) / 2}" y="${T + 12}" text-anchor="middle" font-size="10" fill="var(--cheap)">допустимый диапазон</text>`;
  for (const y of [-1, 0, 1]) s += `<line x1="${L}" x2="${W - R}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--line)"/><text x="${L - 6}" y="${sy(y) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${y < 0 ? "−1" : y}</text>`;
  for (const t of ticksX) s += `<text x="${sx(t)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${piLabel(t)}</text>`;
  s += line(1, "var(--muted)") + line(2, "var(--accent)", "6 4");
  s += `<line class="cx" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>`;
  s += `<rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg>`;
  const legend = `<div class="legend" style="margin:8px 0 0"><span><svg width="22" height="8"><line x1="0" x2="22" y1="4" y2="4" stroke="var(--muted)" stroke-width="2"/></svg> sin</span><span><svg width="22" height="8"><line x1="0" x2="22" y1="4" y2="4" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4"/></svg> ${esc(a.name)}</span></div>`;
  return { html: `${legend}<div class="chart" data-apx-chart="${a.id}">${s}<div class="tip"></div></div>`, sx, sy, W, H, L, R, x0, x1 };
}
function bindChart(el, a, c) {
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cx = el.querySelector(".cx"), hit = el.querySelector(".hit");
  hit.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(), xv = c.x0 + ((e.clientX - r.left) / r.width * c.W - c.L) / (c.W - c.L - c.R) * (c.x1 - c.x0);
    let p = a.plot[0]; for (const q of a.plot) if (Math.abs(q[0] - xv) < Math.abs(p[0] - xv)) p = q;
    const px = c.sx(p[0]); cx.setAttribute("x1", px); cx.setAttribute("x2", px); cx.setAttribute("visibility", "visible");
    const d = p[2] - p[1];
    tip.innerHTML = `x = ${p[0].toFixed(2)}<br>sin ${p[1].toFixed(4)}<br>${esc(a.name)} ${Math.abs(p[2]) < 1e4 ? p[2].toFixed(4) : p[2].toExponential(1)}<br>разница ${Math.abs(d) < 1e-3 ? fmtE(Math.abs(d)) : d.toFixed(3)}`;
    tip.style.display = "block"; tip.style.left = Math.min(r.width - 130, px / c.W * r.width + 10) + "px"; tip.style.top = "8px";
  });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; cx.setAttribute("visibility", "hidden"); });
}

function openApprox(fid) {
  const f = D.funcs.find(x => x.id === fid), list = apxFor(fid), v = S.variant;
  const yes = ok => ok ? `<span class="win">✓</span>` : `<span class="lose">✗</span>`;
  let h = `<button class="btn x" onclick="closeDrawer()">✕</button>
    <h2>${esc(f.hlsl)} — аппроксимации</h2>
    <p class="sub">malioc, Vulkan, ${esc(v)}. Цифры в FMA.</p>`;
  const charts = [];
  for (const a of list) {
    const sp = apxSpeed(a, v);
    h += `<div class="card"><h3>${esc(a.name)}${a.verified.length ? `<span class="badge ok">✓ проверено на устройстве</span>` : `<span class="badge no">не проверено на устройстве</span>`}</h3>
      <div class="sub">${esc(a.summary)}</div>
      <pre class="hlsl"><button class="btn copy" data-copy="${a.id}">копировать</button>${esc(a.hlsl)}</pre>
      <div class="facts">
        <div class="fact"><div class="k">Где работает</div><div class="v">${esc(a.domain_text)}</div></div>
        <div class="fact"><div class="k">Быстрее (медиана)</div><div class="v">×${fmt(sp.all)}</div></div>
        <div class="fact"><div class="k">Ошибка float / half</div><div class="v">${fmtE(a.err.float)} / ${fmtE(a.err.half)}</div></div>
        <div class="fact" title="${esc(a.spec_text)}"><div class="k">Точность как у ${esc(f.hlsl)}</div><div class="v">float ${yes(a.err.float <= a.spec.float)} · half ${yes(a.err.half <= a.spec.half)}</div></div>
      </div>`;
    for (const r of a.verified)
      h += `<div class="verify">✓ ${esc(r.device)} (${esc(r.gpu)}): ${r.calls} вызовов ${esc(f.hlsl)} на пиксель, ${esc(r.res)} — ${r.builtin_ms.toFixed(1)} → ${r.approx_ms.toFixed(1)} мс, <span class="win">×${(r.builtin_ms / r.approx_ms).toFixed(1)}</span></div>`;
    h += `<div class="tscroll"><table><thead><tr><th class="l" title="Медиана по GPU одной архитектуры">Архитектура</th><th>${esc(f.hlsl)}</th><th>${esc(a.name)}</th><th title="Во сколько раз аппроксимация быстрее — для функции отдельно: если шейдер и так упирается в FMA, выигрыш меньше">выигрыш</th></tr></thead><tbody>`;
    for (const ar of ARCH_ORDER) {
      const d = sp.by[ar]; if (!d) continue;
      const k = median(d.k), G = GROUPS[ar], cls = k >= 1.15 ? "win" : k <= 0.87 ? "lose" : "tie";
      h += `<tr><td class="l"><span class="${G.cls}">${G.name}</span> <span class="code">${G.years}</span></td><td>${fmt(median(d.b))}</td><td>${fmt(median(d.x))}</td><td class="${cls}">${k >= 1.15 ? "✓" : k <= 0.87 ? "✗" : "≈"} ×${fmt(k)}</td></tr>`;
    }
    h += `</tbody></table></div>`;
    const c = valChart(a); charts.push([a, c]); h += c.html;
    h += `<details><summary>По каждому GPU</summary><div class="tscroll"><table><thead><tr><th class="l">GPU</th><th>${esc(f.hlsl)}</th><th>${esc(a.name)}</th><th title="Во сколько раз аппроксимация быстрее на этом GPU">выигрыш</th></tr></thead><tbody>` +
      D.gpus.filter(g => a.cost[g.name]?.[v]).map(g => { const [b, x] = a.cost[g.name][v], k = b / x;
        return `<tr title="${esc(gpuTitle(g))}"><td class="l">${g.name}</td><td>${fmt(b)}</td><td>${fmt(x)}</td><td class="${k >= 1.15 ? "win" : k <= 0.87 ? "lose" : "tie"}">×${fmt(k)}</td></tr>`; }).join("") +
      `</tbody></table></div></details></div>`;
  }
  const dr = document.getElementById("drawer"); dr.innerHTML = h; dr.classList.add("open"); dr.scrollTop = 0;
  for (const [a, c] of charts) bindChart(dr.querySelector(`[data-apx-chart="${a.id}"]`), a, c);
  dr.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const a = list.find(x => x.id === b.dataset.copy);
    navigator.clipboard?.writeText(a.hlsl).then(() => { b.textContent = "скопировано"; setTimeout(() => b.textContent = "копировать", 1200); });
  });
}

function openDrawer(fid) {
  const f = D.funcs.find(x => x.id === fid), s = stats(fid);
  const byVar = VARIANTS.map(v => {
    const a = D.gpus.map(g => get(fid, g.name, v)).filter(r => r && r.rel_fma != null);
    return [v, median(a.map(r => r.rel_fma)), a[0]?.type];
  });
  let diff = 0, tot = 0;
  for (const g of D.gpus) for (const v of VARIANTS) {
    const a = get(fid, g.name, v, "GLES"), b = get(fid, g.name, v, "Vulkan");
    if (a && b) { tot++; if (Math.abs(a.cycles - b.cycles) > 1e-4) diff++; }
  }
  const n = x => x == null ? "–" : String(+(+x).toFixed(4));
  let h = `<button class="btn x" onclick="closeDrawer()">✕</button>
    <h2>${esc(f.hlsl)} <span class="code">${esc(s.typ)}</span></h2>
    <div class="code">HLSL: ${esc(s.hexpr)} &nbsp;·&nbsp; GLSL: ${esc(s.glsl)}</div>
    <p class="sub">${esc(f.category)}${f.note ? " · " + esc(f.note) : ""}</p>
    ${apxFor(fid).length ? `<p><button class="apx" onclick="openApprox('${fid}')">Аппроксимация</button></p>` : ""}
    <div class="kpis">${byVar.map(([v, m, t]) => `<div class="kpi" style="${heat(m)}"><div class="k">${v}${t && t !== v ? ` (${t})` : ""}</div><div class="v">${fmt(m)}</div><div class="k">медиана, FMA</div></div>`).join("")}</div>
    <p class="sub">Блок: <b class="tip" title="${esc(BOUND_HELP[s.med === 0 ? "—" : s.bound] || "")}">${esc(s.med === 0 ? "—" : (BOUND_RU[s.bound] || s.bound))}</b></p>
    <p class="sub">OpenGL ES и Vulkan: ${diff ? `отличаются в ${diff} из ${tot} случаев (колонка «Разница»)` : "одинаково на всех GPU"}.</p>
    <table><thead><tr><th class="l">GPU</th><th class="l" title="Год выхода GPU">Год</th><th class="l" title="Класс устройств: флагман, средний, бюджетный">Класс</th><th title="Цена в FMA на этом GPU">FMA</th><th></th>${isTex(f) ? "<th title=\"Во сколько выборок tex2D обходится функция\">× tex2D</th><th title=\"Цена вычисления координат, FMA\">коорд., FMA</th>" : ""}${s.anyShort ? `<th title="Цена, если ветвление идёт дешёвой стороной">${isBranch(f) ? "ветка пропущена" : "короткий путь"}</th>` : ""}<th title="Сырые такты malioc на один вызов">такты</th><th title="Такты блока FMA (умножение и сложение) на вызов">FMA-блок</th><th title="Такты блока CVT (сравнения, выбор, типы) на вызов">CVT</th><th title="Такты блока SFU (спецфункции, деление) на вызов">SFU</th><th class="l" title="Самый загруженный блок: где считается функция">Блок</th><th title="Рабочие регистры шейдера с одним вызовом">Рег.</th><th class="l" title="Длины цепочек вызовов, между которыми снят замер; ⚠ — регистры вытесняются в память">Цепочка</th><th title="Насколько функция дороже (+) или дешевле (−) в другом API на этом GPU, в FMA">Разница с ${S.api === "GLES" ? "Vulkan" : "OpenGL ES"}</th></tr></thead><tbody>`;
  let prev = null;
  const vmax = Math.max(0, ...D.gpus.map(g => get(fid, g.name)?.rel_fma || 0));
  for (const g of D.gpus) {
    const r = get(fid, g.name); if (!r) continue;
    if (g.arch !== prev) { prev = g.arch; const G = GROUPS[prev]; h += `<tr class="cat"><td colspan="15">${G.name} · ${G.years}</td></tr>`; }
    const o = get(fid, g.name, S.variant, S.api === "GLES" ? "Vulkan" : "GLES");
    const d = o && o.rel_fma != null && r.rel_fma != null ? o.rel_fma - r.rel_fma : null;
    const [y, segm] = GPU_INFO[g.name] || ["?", ""];
    h += `<tr title="${esc(gpuTitle(g))}"><td class="l">${g.name}</td><td class="l">${y}</td><td class="l code">${segm}</td>
      <td class="heat big" style="${heat(r.rel_fma)}">${fmt(r.rel_fma)}</td><td class="l"><span class="bar" style="width:${vmax ? Math.max(1, (r.rel_fma || 0) / vmax * 120) : 0}px"></span></td>${isTex(f) ? `<td>${fmt(r.rel_tex)}</td><td>${fmt(r.alu_fma)}</td>` : ""}${s.anyShort ? `<td>${fmt(r.rel_short ?? r.rel_fma)}</td>` : ""}<td>${n(r.cycles)}</td><td>${n(r.fma)}</td><td>${n(r.cvt)}</td><td>${n(r.sfu)}</td>
      <td class="l code">${BOUND_RU[r.bound] || r.bound}</td><td>${r.work_regs_1call ?? "–"}</td>
      <td class="l code">${r.chain || "–"}${r.spill === "True" ? " ⚠" : ""}</td>
      <td class="code">${d == null ? "–" : Math.abs(d) < 1e-3 ? "так же" : (d > 0 ? "+" : "") + d.toFixed(2)}</td></tr>`;
  }
  h += `</tbody></table><p class="sub">Тип ${S.variant}, ${S.api === "GLES" ? "OpenGL ES" : "Vulkan"} · <a href="reference.html#fn-columns">что значат колонки ↗</a></p>`;
  const dr = document.getElementById("drawer"); dr.innerHTML = h; dr.classList.add("open");
}
