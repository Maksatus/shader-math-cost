name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit, layer and static tests (malioc / Unity / RenderDoc tests skip without the tools)
        run: python -m unittest discover tests
