<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сравнение</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #667080; --line: #e3e6ea;
  --accent: #2f6fde; --chip: #eef1f5; --hover: #f0f4fb;
  --good: #1f9d55; --medium: #c98a00; --bad: #d0402b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #191d23; --text: #e6e9ee; --muted: #8b95a5; --line: #2a3039;
    --accent: #6a9cff; --chip: #232932; --hover: #20262f;
    --good: #3ccf7f; --medium: #e8b030; --bad: #ff6b55;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #191d23; --text: #e6e9ee; --muted: #8b95a5; --line: #2a3039;
  --accent: #6a9cff; --chip: #232932; --hover: #20262f;
  --good: #3ccf7f; --medium: #e8b030; --bad: #ff6b55;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 18px 20px 40px; }
h1 { font-size: 20px; margin: 0 0 10px; }
h2 { font-size: 15px; margin: 0 0 8px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; overflow-x: auto; }
.ab { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
@media (max-width: 760px) { .ab { grid-template-columns: 1fr; } .ab .arrow { display: none; } }
.side { background: var(--chip); border-radius: 10px; padding: 10px 12px; }
.side .tag { display: inline-block; font-weight: 800; color: #fff; background: var(--muted); border-radius: 6px; padding: 0 7px; margin-right: 6px; }
.side.b .tag { background: var(--accent); }
.side b { font-size: 14px; }
.arrow { align-self: center; font-size: 22px; color: var(--muted); }
.mode { margin-top: 10px; font-size: 13px; }
.warn { border-left: 3px solid var(--medium); background: color-mix(in srgb, var(--medium) 10%, transparent); padding: 8px 12px; border-radius: 6px; margin-top: 10px; font-size: 13px; }
.warn ul { margin: 0; padding-left: 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--text); padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: #fff; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 10px; }
.kpi { background: var(--chip); border-radius: 10px; padding: 10px 12px; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }
.good { color: var(--good); } .bad { color: var(--bad); }
.decomp { margin-top: 12px; display: grid; grid-template-columns: 170px 1fr 120px; gap: 6px 10px; align-items: center; font-size: 13px; }
.dbar { position: relative; height: 12px; background: var(--chip); border-radius: 6px; }
.dbar .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.dbar i { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.row { cursor: pointer; } tr.row:hover td { background: var(--hover); }
tr.row.small td { opacity: .55; }
tr.det > td { background: var(--bg); padding: 10px 14px; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; margin-left: 4px; white-space: nowrap; }
.badge.new { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.badge.gone { color: var(--muted); background: var(--chip); }
.badge.mixed { color: var(--medium); background: color-mix(in srgb, var(--medium) 14%, transparent); }
.badge.flagbad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.badge.flaggood { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.cell-bar { position: relative; height: 8px; width: 120px; background: var(--chip); border-radius: 4px; display: inline-block; vertical-align: middle; }
.cell-bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.cell-bar .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
input[type=search] { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font: inherit; width: 240px; }
.var { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 8px 0; background: var(--panel); }
.var .kw { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 14px; margin-top: 6px; font-size: 12.5px; }
.grid .k { color: var(--muted); }
details summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; }
details p, details li { color: var(--muted); font-size: 13px; }
.split2 { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--chip); }
.split2 i { display: block; height: 100%; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; margin-top: 4px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
const D = /*COMPARE_DATA*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const M = x => x == null ? "—" : (x / 1e6).toFixed(Math.abs(x) < 1e7 ? 2 : 1);
const sM = x => (x > 0 ? "+" : x < 0 ? "−" : "±") + M(Math.abs(x));
const pct = (d, a) => !a ? (d ? "нов." : "0%") : (d > 0 ? "+" : d < 0 ? "−" : "±") + Math.abs(100 * d / a).toFixed(Math.abs(d / a) < 0.1 ? 1 : 0) + "%";
const cls = d => d < 0 ? "good" : d > 0 ? "bad" : "";
const num = x => x == null ? "—" : Math.round(x).toLocaleString("ru-RU");
const pr = x => x == null ? "—" : (+x).toFixed(2);
const when = t => t ? new Date(t * 1000).toLocaleString("ru-RU", {day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit"}) : "—";
const STAGE = {opaque: "непрозрачное", transparent: "прозрачное", post: "постобработка", shadow: "тени", prepass: "препасс",
  ui: "UI", compute: "compute", other: "прочее"};
const PART = {fragment: "пиксели", vertex: "вершины", compute: "compute"};
const UNIT = {fragment: "пикс.", vertex: "верш.", compute: "потоков"};
const FLAG = {spilling: "spilling", regs_gt32: "регистров > 32", low_fp16: "мало fp16", dynamic_loop: "динамический цикл", sfu_bound: "упор в SFU"};
let core = D && D.main_core, hideSmall = true, query = "", open = new Set();

function bar(d, max, w = 120) {
  const f = max ? Math.min(1, Math.abs(d) / max) : 0;
  const style = d < 0 ? `right:50%;width:${50 * f}%;background:var(--good)` : `left:50%;width:${50 * f}%;background:var(--bad)`;
  return `<span class="cell-bar" style="width:${w}px"><span class="mid"></span><i style="${style}"></i></span>`;
}

function side(i, tag) {
  return `<div class="side ${tag === "B" ? "b" : ""}"><span class="tag">${tag}</span><b>${esc(i.snapshot || "?")}</b>
    <div class="small muted">расчёт ${when(i.computed_at)} · ${esc(i.project || "")}</div>
    <div class="small muted">${esc(i.api || "")} · malioc ${esc(i.malioc || "?")}${i.resolution ? " · " + i.resolution.join("×") : ""}${i.quality ? " · " + esc(i.quality) : ""}</div></div>`;
}

function render() {
  if (!D) { $("#app").innerHTML = `<div class="empty">Нет данных сравнения.</div>`; return; }
  const x = D.by_core[core];
  const head = `<div class="card"><h1>Сравнение кадров</h1>
    <div class="ab">${side(D.a, "A")}<div class="arrow">→</div>${side(D.b, "B")}</div>
    <div class="mode">${D.same_frame
      ? "<b>Тот же снимок, посчитанный дважды.</b> Пиксели и вершины одинаковые, поэтому вся разница — это цена шейдеров."
      : "<b>Два разных снимка.</b> Разница складывается из цены шейдеров и объёма работы: ракурс, сцена, LOD, анимации. Ниже они разделены."}</div>
    ${D.warnings.length ? `<div class="warn"><ul>${D.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
    <details style="margin-top:10px"><summary>Как читать</summary>
      <p>Всё в циклах GPU на кадр (млн) на выбранном ядре. Минус и зелёный — стало дешевле, плюс и красный — дороже.</p>
      <ul><li><b>Цена</b> — шейдер стал дешевле или дороже на пиксель / вершину: эффект правки шейдера.</li>
      <li><b>Объём</b> — шейдер рисует больше или меньше пикселей / вершин: ракурс, сцена, LOD, перерисовка.</li>
      <li><b>Состав</b> — варианты, которые есть только в A или только в B: поменялись keywords, шейдер добавили или убрали.</li></ul>
      <p>Цена + объём + состав = разница. События сопоставляются по варианту шейдера (шейдер, пасс, keywords), а не по номеру.</p></details></div>`;
  if (!x) { $("#app").innerHTML = head; return; }
  const cores = D.cores.length > 1 ? `<div class="seg" id="cores">${D.cores.map(c => `<button data-c="${esc(c)}" class="${c === core ? "on" : ""}">${esc(c)}${c === D.main_core ? " ★" : ""}</button>`).join("")}</div>` : `<b>${esc(core)}</b>`;
  const maxPart = Math.max(Math.abs(x.price), Math.abs(x.work), Math.abs(x.mix), 1);
  const part = (name, v, note) => `<div>${name}<div class="small muted">${note}</div></div><div class="dbar"><span class="mid"></span><i style="${v < 0 ? `right:50%;width:${50 * Math.abs(v) / maxPart}%;background:var(--good)` : `left:50%;width:${50 * Math.abs(v) / maxPart}%;background:var(--bad)`}"></i></div><div class="num ${cls(v)}"><b>${sM(v)}</b> млн</div>`;
  const sp = (s, k) => s ? 100 * x.split[k][s] / Math.max(x.split.fragment[s] + x.split.vertex[s] + x.split.compute[s], 1) : 0;
  const splitBar = s => `<div class="split2"><i style="width:${sp(s, "fragment")}%;background:var(--accent)"></i><i style="width:${sp(s, "vertex")}%;background:var(--medium)"></i><i style="width:${sp(s, "compute")}%;background:var(--bad)"></i></div>`;
  const summary = `<div class="card"><div class="tools"><h2 style="margin:0">Итог кадра</h2><span style="flex:1"></span><span class="small muted">Ядро</span>${cores}</div>
    <div class="kpis">
      <div class="kpi"><div class="k">A, было</div><div class="v">${M(x.a)}</div><div class="s">млн циклов</div></div>
      <div class="kpi"><div class="k">B, стало</div><div class="v">${M(x.b)}</div><div class="s">млн циклов</div></div>
      <div class="kpi"><div class="k">Разница</div><div class="v ${cls(x.delta)}">${sM(x.delta)}</div><div class="s ${cls(x.delta)}">${pct(x.delta, x.a)} ${x.delta < 0 ? "дешевле" : x.delta > 0 ? "дороже" : ""}</div></div>
    </div>
    <div class="decomp">${part("Цена шейдеров", x.price, "сами шейдеры")}${part("Объём работы", x.work, "пиксели, вершины, потоки")}${part("Состав вариантов", x.mix, "новые и пропавшие")}</div>
    <div style="display:grid;grid-template-columns:30px 1fr;gap:4px 8px;align-items:center;margin-top:14px;font-size:12px">
      <b>A</b>${splitBar("a")}<b>B</b>${splitBar("b")}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>пиксели ${M(x.split.fragment.a)} → ${M(x.split.fragment.b)}</span>
      <span><i style="background:var(--medium)"></i>вершины ${M(x.split.vertex.a)} → ${M(x.split.vertex.b)}</span>
      <span><i style="background:var(--bad)"></i>compute ${M(x.split.compute.a)} → ${M(x.split.compute.b)}</span></div></div>`;
  const smax = Math.max(...x.stages.map(s => Math.abs(s.delta)), 1);
  const stages = `<div class="card"><h2>По стадиям кадра</h2><table><tr><th>Стадия</th><th class="n">A</th><th class="n">B</th><th class="n">Разница</th><th class="n"></th><th></th></tr>
    ${x.stages.map(s => `<tr><td>${esc(STAGE[s.stage] || s.stage)}</td><td class="n">${M(s.a)}</td><td class="n">${M(s.b)}</td>
      <td class="n ${cls(s.delta)}">${sM(s.delta)}</td><td class="n ${cls(s.delta)}">${pct(s.delta, s.a)}</td><td>${bar(s.delta, smax)}</td></tr>`).join("")}</table></div>`;
  const small = s => Math.abs(s.delta) < 0.001 * Math.max(x.a, x.b);
  let rows = x.shaders.filter(s => !query || s.shader.toLowerCase().includes(query));
  const hidden = hideSmall ? rows.filter(small).length : 0;
  if (hideSmall) rows = rows.filter(s => !small(s));
  const dmax = Math.max(...rows.map(s => Math.abs(s.delta)), 1);
  const tbl = rows.map((s, i) => {
    const id = s.shader;
    const badges = (s.status === "new" ? `<span class="badge new">новый</span>` : s.status === "gone" ? `<span class="badge gone">пропал</span>` : s.status === "mixed" ? `<span class="badge mixed">варианты поменялись</span>` : "")
      + s.flags_added.map(f => `<span class="badge flagbad">+ ${esc(FLAG[f] || f)}</span>`).join("") + s.flags_removed.map(f => `<span class="badge flaggood">− ${esc(FLAG[f] || f)}</span>`).join("");
    return `<tr class="row ${small(s) ? "small" : ""}" data-id="${esc(id)}"><td>${open.has(id) ? "▾" : "▸"} <b>${esc(s.shader)}</b>${badges}</td>
      <td class="n">${M(s.a)}</td><td class="n">${M(s.b)}</td><td class="n ${cls(s.delta)}"><b>${sM(s.delta)}</b></td><td class="n ${cls(s.delta)}">${pct(s.delta, s.a)}</td>
      <td>${bar(s.delta, dmax)}</td><td class="n ${cls(s.price)}">${Math.abs(s.price) > 1 ? sM(s.price) : "·"}</td><td class="n ${cls(s.work)}">${Math.abs(s.work) > 1 ? sM(s.work) : "·"}</td>
      <td class="n ${cls(s.mix)}">${Math.abs(s.mix) > 1 ? sM(s.mix) : "·"}</td></tr>` + (open.has(id) ? `<tr class="det"><td colspan="9">${details(s)}</td></tr>` : "");
  }).join("");
  const shaders = `<div class="card"><div class="tools"><h2 style="margin:0">По шейдерам</h2><span class="small muted">клик по строке — варианты и события</span><span style="flex:1"></span>
      <input type="search" id="q" placeholder="Найти шейдер…" value="${esc(query)}">
      <label class="small"><input type="checkbox" id="hs" ${hideSmall ? "checked" : ""}> скрыть изменения меньше 0.1% кадра${hidden ? ` (${hidden})` : ""}</label></div>
    <table><tr><th>Шейдер</th><th class="n">A</th><th class="n">B</th><th class="n">Разница</th><th class="n"></th><th></th><th class="n">цена</th><th class="n">объём</th><th class="n">состав</th></tr>
    ${tbl || `<tr><td colspan="9" class="muted">Нет изменений${hidden ? " крупнее 0.1% кадра" : ""}.</td></tr>`}</table></div>`;
  $("#app").innerHTML = head + summary + stages + shaders;
  document.querySelectorAll("#cores button").forEach(b => b.onclick = () => { core = b.dataset.c; render(); });
  const q = $("#q");
  q.oninput = () => { query = q.value.toLowerCase(); const p = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); };
  $("#hs").onchange = e => { hideSmall = e.target.checked; render(); };
  document.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => { const id = tr.dataset.id; open.has(id) ? open.delete(id) : open.add(id); render(); });
}

function details(s) {
  const same = s.variants.filter(v => v.status === "both" && Math.abs(v.delta) < 1);
  const shown = s.variants.filter(v => !same.includes(v));
  return (shown.length ? shown : same).map(v => {
    const st = v.status === "new" ? `<span class="badge new">только в B</span>` : v.status === "gone" ? `<span class="badge gone">только в A</span>` : "";
    const a = v.stats_a || {}, b = v.stats_b || {};
    const ch = (k, label, f = x => x ?? "—") => (a[k] != null || b[k] != null) ? `<div><span class="k">${label}:</span> ${v.status === "both" ? `${f(a[k])} → ${f(b[k])}` : f((v.stats_b || v.stats_a)[k])}</div>` : "";
    const parts = Object.entries(v.stages).map(([k, p]) => `<div><span class="k">${PART[k]}:</span> ${v.status === "both"
      ? `${num(p.work_a)} → ${num(p.work_b)} ${UNIT[k]} × ${pr(p.price_a)} → ${pr(p.price_b)} цикл.` : `${num(p.work_a ?? p.work_b)} ${UNIT[k]} × ${pr(p.price_a ?? p.price_b)} цикл.`}</div>`).join("");
    const flags = v.status === "both" ? v.flags_added.map(f => `<span class="badge flagbad">+ ${esc(FLAG[f] || f)}</span>`).join("") + v.flags_removed.map(f => `<span class="badge flaggood">− ${esc(FLAG[f] || f)}</span>`).join("")
      : ((v.stats_b || v.stats_a).flags || []).map(f => `<span class="badge gone">${esc(FLAG[f] || f)}</span>`).join("");
    const evs = v.events.map(e => `<tr><td>${esc(e.object || "—")}</td><td>${esc(STAGE[e.stage] || e.stage || "")}</td>
      <td class="n">${e.index_a != null ? "#" + (e.index_a + 1) : "—"} / ${e.index_b != null ? "#" + (e.index_b + 1) : "—"}</td>
      <td class="n">${num(e.pixels_a)} → ${num(e.pixels_b)}</td><td class="n">${e.a == null ? "—" : M(e.a)}</td><td class="n">${e.b == null ? "—" : M(e.b)}</td>
      <td class="n ${cls(e.delta)}">${sM(e.delta)}</td></tr>`).join("");
    return `<div class="var"><div><b>${esc(v.pass || "")}</b> ${st} <span class="${cls(v.delta)}" style="float:right"><b>${sM(v.delta)}</b> млн (${M(v.a)} → ${M(v.b)})</span></div>
      <div class="kw">${esc(v.keywords.join(" ") || "без keywords")}</div>
      ${v.status === "both" ? `<div class="small" style="margin-top:4px">цена <b class="${cls(v.price)}">${sM(v.price)}</b> · объём <b class="${cls(v.work)}">${sM(v.work)}</b></div>` : ""}
      <div class="grid">${parts}${ch("px_regs", "регистры пикселя")}${ch("vtx_regs", "регистры вершины")}${ch("px_fp16", "fp16 пикселя, %")}
        ${ch("px_bound", "упор пикселя", x => x ? x.join("+") : "—")}${ch("px_path", "путь пикселя")}</div>
      ${flags ? `<div style="margin-top:6px">${flags}</div>` : ""}
      ${evs ? `<details style="margin-top:6px"><summary>События (${v.events_count}${v.events_count > v.events.length ? `, показаны ${v.events.length} с наибольшей разницей` : ""})</summary>
        <table style="margin-top:4px"><tr><th>Объект</th><th>Стадия</th><th class="n">Номер A / B</th><th class="n">Пиксели</th><th class="n">A</th><th class="n">B</th><th class="n">Разница</th></tr>${evs}</table></details>` : ""}</div>`;
  }).join("") + (shown.length && same.length ? `<div class="small muted">Ещё ${same.length} ${same.length === 1 ? "вариант" : "вариантов"} без изменений: ${same.map(v => esc(v.pass || v.variant)).join(", ")}</div>` : "");
}
render();
</script>
</body>
</html>
