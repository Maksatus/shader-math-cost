[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paretogpu"
version = "0.1.0"
description = "ParetoGPU: Mali shader and frame cost profiler built on malioc"
requires-python = ">=3.10"

[project.scripts]
paretogpu = "paretogpu.cli:main"

[tool.setuptools.packages.find]
include = ["paretogpu*"]
