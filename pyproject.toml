[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shaderopt"
version = "0.1.0"
description = "Mali shader profiler built on malioc"
requires-python = ">=3.10"

[project.scripts]
shaderopt = "shaderopt.cli:main"

[tool.setuptools.packages.find]
include = ["shaderopt*"]
