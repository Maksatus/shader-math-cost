<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сравнение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #121417; --panel: #1a1e23; --text: #eceef0; --muted: #8b939c; --line: #2a3038;
  --accent: #34d399; --on-accent: #062a1d; --chip: #232830; --hover: #20252b;
  --cheap: #8bd99b; --medium: #e8c27a; --heavy: #f2877b; --info: #7fb2e5; --bar: #55606c;
  --part-px: #7fb2e5; --part-vx: #b9a3e0; --part-cs: #6cc4c4;
  --sans: Manrope, system-ui, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); font-variant-numeric: tabular-nums; }
main { max-width: 1400px; margin: 0 auto; padding: 18px 20px 40px; }
h1 { font-size: 20px; margin: 0 0 10px; }
h2 { font-size: 15px; margin: 0 0 8px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; overflow-x: auto; }
.ab { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
@media (max-width: 760px) { .ab { grid-template-columns: 1fr; } .ab .arrow { display: none; } }
.side { background: var(--chip); border-radius: 10px; padding: 10px 12px; }
.side .tag { display: inline-block; font-weight: 800; color: var(--bg); background: var(--muted); border-radius: 6px; padding: 0 7px; margin-right: 6px; }
.side.b .tag { background: var(--info); }
.side b { font-size: 14px; }
.arrow { align-self: center; font-size: 22px; color: var(--muted); }
.mode { margin-top: 10px; font-size: 13px; }
.warn { border-left: 3px solid var(--medium); background: color-mix(in srgb, var(--medium) 10%, transparent); padding: 8px 12px; border-radius: 6px; margin-top: 10px; font-size: 13px; }
.warn ul { margin: 0; padding-left: 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--text); padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 10px; }
.kpi { background: var(--chip); border-radius: 10px; padding: 10px 12px; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }
.good { color: var(--cheap); } .bad { color: var(--heavy); }
.decomp { margin-top: 12px; display: grid; grid-template-columns: 170px 1fr 120px; gap: 6px 10px; align-items: center; font-size: 13px; }
.dbar { position: relative; height: 12px; background: var(--chip); border-radius: 6px; }
.dbar .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.dbar i { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.row { cursor: pointer; } tr.row:hover td { background: var(--hover); }
tr.row.small td { opacity: .55; }
tr.det > td { background: var(--bg); padding: 10px 14px; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; margin-left: 4px; white-space: nowrap; }
.badge.new { color: var(--info); background: color-mix(in srgb, var(--info) 14%, transparent); }
.badge.gone { color: var(--muted); background: var(--chip); }
.badge.mixed { color: var(--medium); background: color-mix(in srgb, var(--medium) 14%, transparent); }
.badge.flagbad { color: var(--heavy); background: color-mix(in srgb, var(--heavy) 12%, transparent); }
.badge.flaggood { color: var(--cheap); background: color-mix(in srgb, var(--cheap) 12%, transparent); }
.cell-bar { position: relative; height: 8px; width: 120px; background: var(--chip); border-radius: 4px; display: inline-block; vertical-align: middle; }
.cell-bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.cell-bar .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
input[type=search] { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font: inherit; width: 240px; }
.var { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 8px 0; background: var(--panel); }
.var .kw { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 14px; margin-top: 6px; font-size: 12.5px; }
.grid .k { color: var(--muted); }
details summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; }
details p, details li { color: var(--muted); font-size: 13px; }
.split2 { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--chip); }
.split2 i { display: block; height: 100%; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; margin-top: 4px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.kwc { display: inline-block; font: 11.5px var(--mono); background: var(--chip); border-radius: 5px; padding: 0 6px; margin: 1px 0; }
.verdict { border-left: 4px solid var(--muted); background: var(--chip); border-radius: 8px; padding: 12px 14px; margin: 4px 0 6px; }
.verdict.va, .verdict.vb { border-left-color: var(--cheap); }
.verdict .vh { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
.card h3 { font-size: 13.5px; margin: 18px 0 6px; }
tr.sel td { background: var(--chip); }
tr.subp td { color: var(--muted); font-size: 12.5px; }
th.grp { text-align: center; border-bottom: 0; }
/* tables of one pass share one grid: label 210px, every number 96px, A | B | B − A always in the same place */
table.cmp { width: auto; table-layout: fixed; }
table.cmp td, table.cmp th { overflow: hidden; text-overflow: ellipsis; }
table.cmp td.n { font-family: var(--mono); font-size: 12.5px; }
table.cmp .gl { border-left: 1px solid var(--line); }
table.chars { table-layout: fixed; }
.hot { color: var(--medium); }
.bnd { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--chip, #232830); cursor: help; white-space: nowrap; }
.bnd i { font-style: normal; font-weight: 400; color: var(--muted); }
.costhelp { color: var(--accent, #34d399); font-size: 12px; text-decoration: none; }
.costhelp:hover { text-decoration: underline; }
.abl { margin-top: 16px; }
.parts td { cursor: pointer; }
.parts tr.on td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.parts td.code, .codev td.code { font: 12.5px var(--mono); white-space: pre; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
.parts tr.kid td { color: var(--muted); }
.codev { max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; }
.codev table { margin: 0; }
.codev td { padding: 1px 8px; border-bottom: 0; vertical-align: middle; }
.codev td.no { color: var(--muted); font: 11.5px var(--mono); text-align: right; width: 52px; user-select: none; }
.codev td.heat { width: 150px; }
.codev td.val { width: 64px; font: 11.5px var(--mono); text-align: right; color: var(--muted); }
.codev tr.part td { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.codev tr.mv td { background: color-mix(in srgb, var(--info) 16%, transparent); }
.codev tr.sel td { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.hb { height: 8px; border-radius: 4px; background: var(--heavy); opacity: .85; }
.hb.lo { background: var(--medium); }
.empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
const D = /*COMPARE_DATA*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const M = x => x == null ? "—" : (x / 1e6).toFixed(Math.abs(x) < 1e7 ? 2 : 1);
const sM = x => (x > 0 ? "+" : x < 0 ? "−" : "±") + M(Math.abs(x));
const pct = (d, a) => !a ? (d ? "нов." : "0%") : (d > 0 ? "+" : d < 0 ? "−" : "±") + Math.abs(100 * d / a).toFixed(Math.abs(d / a) < 0.1 ? 1 : 0) + "%";
const cls = d => d < 0 ? "good" : d > 0 ? "bad" : "";
const num = x => x == null ? "—" : Math.round(x).toLocaleString("ru-RU");
const pr = x => x == null ? "—" : (+x).toFixed(2);
const when = t => t ? new Date(t * 1000).toLocaleString("ru-RU", {day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit"}) : "—";
const STAGE = {opaque: "непрозрачное", transparent: "прозрачное", post: "постобработка", shadow: "тени", prepass: "препасс",
  ui: "UI", compute: "compute", other: "прочее"};
const PART = {fragment: "пиксели", vertex: "вершины", compute: "compute"};
const UNIT = {fragment: "пикс.", vertex: "верш.", compute: "потоков"};
const FLAG = {spilling: "spilling", regs_gt32: "регистров > 32", low_fp16: "мало fp16", dynamic_loop: "динамический цикл", sfu_bound: "упор в SFU"};
// the pipes of a Mali shader core (malioc): the bound is the busiest one, its cycles are the price
const PIPE = {
  arith: ["A", "арифметика", "Арифметика: FMA, CVT и SFU вместе"],
  fma: ["FMA", "умножение/сложение", "FMA — умножение и сложение (+ * mad lerp dot). Упор: меньше математики, half вместо float"],
  cvt: ["CVT", "сравнения/типы", "CVT — сравнения, выбор и преобразования типов (min max clamp step ?:, half↔float). Упор: меньше сравнений и преобразований"],
  sfu: ["SFU", "спецфункции", "SFU — спецфункции (rcp sqrt exp log sin cos) и деление. Упор: заменить их приближениями"],
  ls: ["LS", "память", "LS — load/store: чтение буферов (свет Forward+, константы), спилл регистров, атомики. Упор: убрать спилл, меньше чтений буферов в циклах"],
  v: ["V", "varyings", "V — интерполяция varyings из вершинного шейдера. Упор: меньше varyings, передавать в half"],
  t: ["T", "текстуры", "T — выборки и фильтрация текстур. Упор: меньше выборок, ASTC, mip-map, проще фильтрация"],
};
const SITE_REF = location.protocol.startsWith("http") && /^(127\.0\.0\.1|localhost)$/.test(location.hostname)
  ? "/site/reference.html" : "https://maksatus.github.io/shader-math-cost/reference.html";
const SITE_COST = SITE_REF + "#cost";
const boundTag = b => b && b.length ? b.map(x => { const p = PIPE[x] || [x, "", ""];
  return `<span class="bnd" title="${esc(p[2] + " · клик — справочник")}" onclick="window.open(SITE_REF + '#fix', '_blank')">${esc(p[0])}${p[1] ? ` <i>${esc(p[1])}</i>` : ""}</span>`; }).join(" + ") : "—";
const costHelp = `<a href="${SITE_COST}" target="_blank" class="costhelp">как считается цена — справочник ↗</a>`;
const refLink = (id, text) => `<a href="${SITE_REF}#${id}" target="_blank" class="costhelp">${text} — справочник ↗</a>`;
let core = D && D.main_core, hideSmall = true, query = "", open = new Set();

function bar(d, max, w = 120) {
  const f = max ? Math.min(1, Math.abs(d) / max) : 0;
  const style = d < 0 ? `right:50%;width:${50 * f}%;background:var(--cheap)` : `left:50%;width:${50 * f}%;background:var(--heavy)`;
  return `<span class="cell-bar" style="width:${w}px"><span class="mid"></span><i style="${style}"></i></span>`;
}

function side(i, tag) {
  return `<div class="side ${tag === "B" ? "b" : ""}"><span class="tag">${tag}</span><b>${esc(i.snapshot || "?")}</b>
    <div class="small muted">расчёт ${when(i.computed_at)} · ${esc(i.project || "")}</div>
    <div class="small muted">${esc(i.api || "")} · malioc ${esc(i.malioc || "?")}${i.resolution ? " · " + i.resolution.join("×") : ""}${i.quality ? " · " + esc(i.quality) : ""}</div></div>`;
}

function render() {
  if (!D) { $("#app").innerHTML = `<div class="empty">Нет данных сравнения.</div>`; return; }
  if (D.kind === "materials") return renderMaterials();
  if (D.kind === "material") return renderMaterial();
  if (D.kind === "hotspots") return renderHotspots();
  const x = D.by_core[core];
  const head = `<div class="card"><h1>Сравнение кадров</h1>
    <div class="ab">${side(D.a, "A")}<div class="arrow">→</div>${side(D.b, "B")}</div>
    <div class="mode">${D.same_frame
      ? "<b>Тот же снимок, посчитанный дважды.</b> Пиксели и вершины одинаковые, поэтому вся разница — это цена шейдеров."
      : "<b>Два разных снимка.</b> Разница складывается из цены шейдеров и объёма работы: ракурс, сцена, LOD, анимации. Ниже они разделены."}</div>
    ${D.warnings.length ? `<div class="warn"><ul>${D.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
    <p class="small" style="margin:10px 0 0">${refLink("compare-frames", "Как читать сравнение")}</p></div>`;
  if (!x) { $("#app").innerHTML = head; return; }
  const cores = D.cores.length > 1 ? `<div class="seg" id="cores">${D.cores.map(c => `<button data-c="${esc(c)}" class="${c === core ? "on" : ""}">${esc(c)}${c === D.main_core ? " ★" : ""}</button>`).join("")}</div>` : `<b>${esc(core)}</b>`;
  const maxPart = Math.max(Math.abs(x.price), Math.abs(x.work), Math.abs(x.mix), 1);
  const part = (name, v, note) => `<div>${name}<div class="small muted">${note}</div></div><div class="dbar"><span class="mid"></span><i style="${v < 0 ? `right:50%;width:${50 * Math.abs(v) / maxPart}%;background:var(--cheap)` : `left:50%;width:${50 * Math.abs(v) / maxPart}%;background:var(--heavy)`}"></i></div><div class="num ${cls(v)}"><b>${sM(v)}</b> млн</div>`;
  const sp = (s, k) => s ? 100 * x.split[k][s] / Math.max(x.split.fragment[s] + x.split.vertex[s] + x.split.compute[s], 1) : 0;
  const splitBar = s => `<div class="split2"><i style="width:${sp(s, "fragment")}%;background:var(--part-px)"></i><i style="width:${sp(s, "vertex")}%;background:var(--part-vx)"></i><i style="width:${sp(s, "compute")}%;background:var(--part-cs)"></i></div>`;
  const summary = `<div class="card"><div class="tools"><h2 style="margin:0">Итог кадра</h2><span style="flex:1"></span><span class="small muted">Ядро</span>${cores}</div>
    <div class="kpis">
      <div class="kpi"><div class="k">A, было</div><div class="v">${M(x.a)}</div><div class="s">млн циклов</div></div>
      <div class="kpi"><div class="k">B, стало</div><div class="v">${M(x.b)}</div><div class="s">млн циклов</div></div>
      <div class="kpi"><div class="k">Разница</div><div class="v ${cls(x.delta)}">${sM(x.delta)}</div><div class="s ${cls(x.delta)}">${pct(x.delta, x.a)} ${x.delta < 0 ? "дешевле" : x.delta > 0 ? "дороже" : ""}</div></div>
    </div>
    <div class="decomp">${part("Цена шейдеров", x.price, "сами шейдеры")}${part("Объём работы", x.work, "пиксели, вершины, потоки")}${part("Состав вариантов", x.mix, "новые и пропавшие")}</div>
    <div style="display:grid;grid-template-columns:30px 1fr;gap:4px 8px;align-items:center;margin-top:14px;font-size:12px">
      <b>A</b>${splitBar("a")}<b>B</b>${splitBar("b")}</div>
    <div class="legend"><span><i style="background:var(--part-px)"></i>пиксели ${M(x.split.fragment.a)} → ${M(x.split.fragment.b)}</span>
      <span><i style="background:var(--part-vx)"></i>вершины ${M(x.split.vertex.a)} → ${M(x.split.vertex.b)}</span>
      <span><i style="background:var(--part-cs)"></i>compute ${M(x.split.compute.a)} → ${M(x.split.compute.b)}</span></div></div>`;
  const smax = Math.max(...x.stages.map(s => Math.abs(s.delta)), 1);
  const stages = `<div class="card"><h2>По стадиям кадра</h2><table><tr><th>Стадия</th><th class="n">A</th><th class="n">B</th><th class="n">Разница</th><th class="n"></th><th></th></tr>
    ${x.stages.map(s => `<tr><td>${esc(STAGE[s.stage] || s.stage)}</td><td class="n">${M(s.a)}</td><td class="n">${M(s.b)}</td>
      <td class="n ${cls(s.delta)}">${sM(s.delta)}</td><td class="n ${cls(s.delta)}">${pct(s.delta, s.a)}</td><td>${bar(s.delta, smax)}</td></tr>`).join("")}</table></div>`;
  const small = s => Math.abs(s.delta) < 0.001 * Math.max(x.a, x.b);
  let rows = x.shaders.filter(s => !query || s.shader.toLowerCase().includes(query));
  const hidden = hideSmall ? rows.filter(small).length : 0;
  if (hideSmall) rows = rows.filter(s => !small(s));
  const dmax = Math.max(...rows.map(s => Math.abs(s.delta)), 1);
  const tbl = rows.map((s, i) => {
    const id = s.shader;
    const badges = (s.status === "new" ? `<span class="badge new">новый</span>` : s.status === "gone" ? `<span class="badge gone">пропал</span>` : s.status === "mixed" ? `<span class="badge mixed">варианты поменялись</span>` : "")
      + s.flags_added.map(f => `<span class="badge flagbad">+ ${esc(FLAG[f] || f)}</span>`).join("") + s.flags_removed.map(f => `<span class="badge flaggood">− ${esc(FLAG[f] || f)}</span>`).join("");
    return `<tr class="row ${small(s) ? "small" : ""}" data-id="${esc(id)}"><td>${open.has(id) ? "▾" : "▸"} <b>${esc(s.shader)}</b>${badges}</td>
      <td class="n">${M(s.a)}</td><td class="n">${M(s.b)}</td><td class="n ${cls(s.delta)}"><b>${sM(s.delta)}</b></td><td class="n ${cls(s.delta)}">${pct(s.delta, s.a)}</td>
      <td>${bar(s.delta, dmax)}</td><td class="n ${cls(s.price)}">${Math.abs(s.price) > 1 ? sM(s.price) : "·"}</td><td class="n ${cls(s.work)}">${Math.abs(s.work) > 1 ? sM(s.work) : "·"}</td>
      <td class="n ${cls(s.mix)}">${Math.abs(s.mix) > 1 ? sM(s.mix) : "·"}</td></tr>` + (open.has(id) ? `<tr class="det"><td colspan="9">${details(s)}</td></tr>` : "");
  }).join("");
  const shaders = `<div class="card"><div class="tools"><h2 style="margin:0">По шейдерам</h2><span class="small muted">клик по строке — варианты и события</span><span style="flex:1"></span>
      <input type="search" id="q" placeholder="Найти шейдер…" value="${esc(query)}">
      <label class="small"><input type="checkbox" id="hs" ${hideSmall ? "checked" : ""}> скрыть изменения меньше 0.1% кадра${hidden ? ` (${hidden})` : ""}</label></div>
    <table><tr><th>Шейдер</th><th class="n">A</th><th class="n">B</th><th class="n">Разница</th><th class="n"></th><th></th><th class="n">цена</th><th class="n">объём</th><th class="n">состав</th></tr>
    ${tbl || `<tr><td colspan="9" class="muted">Нет изменений${hidden ? " крупнее 0.1% кадра" : ""}.</td></tr>`}</table></div>`;
  $("#app").innerHTML = head + summary + stages + shaders;
  document.querySelectorAll("#cores button").forEach(b => b.onclick = () => { core = b.dataset.c; render(); });
  const q = $("#q");
  q.oninput = () => { query = q.value.toLowerCase(); const p = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); };
  $("#hs").onchange = e => { hideSmall = e.target.checked; render(); };
  document.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => { const id = tr.dataset.id; open.has(id) ? open.delete(id) : open.add(id); render(); });
}

function details(s) {
  const same = s.variants.filter(v => v.status === "both" && Math.abs(v.delta) < 1);
  const shown = s.variants.filter(v => !same.includes(v));
  return (shown.length ? shown : same).map(v => {
    const st = v.status === "new" ? `<span class="badge new">только в B</span>` : v.status === "gone" ? `<span class="badge gone">только в A</span>` : "";
    const a = v.stats_a || {}, b = v.stats_b || {};
    const ch = (k, label, f = x => x ?? "—") => (a[k] != null || b[k] != null) ? `<div><span class="k">${label}:</span> ${v.status === "both" ? `${f(a[k])} → ${f(b[k])}` : f((v.stats_b || v.stats_a)[k])}</div>` : "";
    const parts = Object.entries(v.stages).map(([k, p]) => `<div><span class="k">${PART[k]}:</span> ${v.status === "both"
      ? `${num(p.work_a)} → ${num(p.work_b)} ${UNIT[k]} × ${pr(p.price_a)} → ${pr(p.price_b)} цикл.` : `${num(p.work_a ?? p.work_b)} ${UNIT[k]} × ${pr(p.price_a ?? p.price_b)} цикл.`}</div>`).join("");
    const flags = v.status === "both" ? v.flags_added.map(f => `<span class="badge flagbad">+ ${esc(FLAG[f] || f)}</span>`).join("") + v.flags_removed.map(f => `<span class="badge flaggood">− ${esc(FLAG[f] || f)}</span>`).join("")
      : ((v.stats_b || v.stats_a).flags || []).map(f => `<span class="badge gone">${esc(FLAG[f] || f)}</span>`).join("");
    const evs = v.events.map(e => `<tr><td>${esc(e.object || "—")}</td><td>${esc(STAGE[e.stage] || e.stage || "")}</td>
      <td class="n">${e.index_a != null ? "#" + (e.index_a + 1) : "—"} / ${e.index_b != null ? "#" + (e.index_b + 1) : "—"}</td>
      <td class="n">${num(e.pixels_a)} → ${num(e.pixels_b)}</td><td class="n">${e.a == null ? "—" : M(e.a)}</td><td class="n">${e.b == null ? "—" : M(e.b)}</td>
      <td class="n ${cls(e.delta)}">${sM(e.delta)}</td></tr>`).join("");
    return `<div class="var"><div><b>${esc(v.pass || "")}</b> ${st} <span class="${cls(v.delta)}" style="float:right"><b>${sM(v.delta)}</b> млн (${M(v.a)} → ${M(v.b)})</span></div>
      <div class="kw">${esc(v.keywords.join(" ") || "без keywords")}</div>
      ${v.status === "both" ? `<div class="small" style="margin-top:4px">цена <b class="${cls(v.price)}">${sM(v.price)}</b> · объём <b class="${cls(v.work)}">${sM(v.work)}</b></div>` : ""}
      <div class="grid">${parts}${ch("px_regs", "регистры пикселя")}${ch("vtx_regs", "регистры вершины")}${ch("px_fp16", "fp16 пикселя, %")}
        ${ch("px_bound", "упор пикселя", boundTag)}${ch("px_path", "путь пикселя")}</div>
      ${flags ? `<div style="margin-top:6px">${flags}</div>` : ""}
      ${evs ? `<details style="margin-top:6px"><summary>События (${v.events_count}${v.events_count > v.events.length ? `, показаны ${v.events.length} с наибольшей разницей` : ""})</summary>
        <table style="margin-top:4px"><tr><th>Объект</th><th>Стадия</th><th class="n">Номер A / B</th><th class="n">Пиксели</th><th class="n">A</th><th class="n">B</th><th class="n">Разница</th></tr>${evs}</table></details>` : ""}</div>`;
  }).join("") + (shown.length && same.length ? `<div class="small muted">Ещё ${same.length} ${same.length === 1 ? "вариант" : "вариантов"} без изменений: ${same.map(v => esc(v.pass || v.variant)).join(", ")}</div>` : "");
}
/* ---------- one material: its shader and what every line costs (python -m paretogpu matshader) ---------- */
let ablMetric = null, ablPart = {}, ablCore = null;
const METRICS = {price: ["Экономия цены", "Насколько упадёт цена шейдера (циклы самого загруженного блока), если убрать часть"],
  arith: ["A", "Арифметика: FMA, CVT, SFU"], ls: ["LS", "Память: буферы, спилл регистров"], v: ["V", "Varyings"], t: ["T", "Текстуры"]};
const mInc = (row, m) => !row || row.error ? null : m === "price" ? row.price : (row.incl || {})[m];
const mSelf = (row, m) => !row || row.error ? null : m === "price" ? row.self_price : (row.self || {})[m];

function singlePipes(x, k, n) {
  const g = x && x[k + "_pipes"];
  if (!g) return "";
  const l = g.longest[n], top = Math.max(...["arith", "ls", "v", "t"].filter(p => l[p] != null).map(p => l[p]));
  const rows = PIPES.filter(([key]) => [l, g.shortest, g.total].some(c => c && c[key] != null)).map(([key, label, sub]) => {
    const hot = ["arith", "ls", "v", "t"].includes(key) && Math.abs(l[key] - top) < 1e-6;
    return `<tr${sub ? ` class="subp"` : ""}><td title="${esc(PIPE[key][2])}" style="cursor:help">${sub ? "&nbsp;&nbsp;&nbsp;" : ""}${label}</td>
      <td class="n">${hot ? `<b class="hot" title="Самый загруженный блок: его циклы и есть цена (упор)">${c1(l[key])} ●</b>` : c1(l[key])}</td>
      <td class="n gl">${c1(g.shortest && g.shortest[key])}</td><td class="n gl">${c1(g.total && g.total[key])}</td></tr>`;
  }).join("");
  return `<table class="cmp">${cols(3)}<tr><th>Конвейер</th><th class="n" title="Самый дорогой путь: каждый if идёт по более дорогой ветке. По нему считается цена">Длинный путь${byNs(x, k) ? ` (n = ${n})` : ""}</th>
    <th class="n gl" title="Все if идут по дешёвой ветке">Короткий</th><th class="n gl" title="Каждая инструкция один раз: объём кода, а не время">Всего</th></tr>${rows}</table>`;
}

const ABL = {}, ablMove = {}, ablCode = {};
// the ablation of one shader stage: its costliest parts, the candidates for the vertex shader, its code with heat
function ablationBlock(key, a, opts = {}) {
  if (!a) return "";
  if (a.error) return `<div class="warn">Разбор по строкам: ${esc(a.error)}</div>`;
  ABL[key] = a;
  const cores = Object.keys(a.by_core);
  const c = cores.includes(core) ? core : cores[0];
  const x = a.by_core[c];
  if (x.base.error) return `<div class="warn">Разбор по строкам на ${esc(c)}: ${esc(x.base.error)}</div>`;
  const ids = Object.keys(a.statements);
  const roots = ids.filter(id => a.statements[id].parent == null && x.stmts[id] && !x.stmts[id].error);
  let m = ablMetric;
  if (!m) m = roots.some(id => (x.stmts[id].price || 0) > 0) ? "price" : "arith";
  const baseV = m === "price" ? x.base.price : x.base.pipes[m];
  const share = v => baseV ? p0(Math.max(0, v) / baseV) : "";
  const sel = ablPart[key];
  const sub = id => [id, ...(a.statements[id].children || []).flatMap(sub)];
  const inPart = new Set(sel != null ? sub(String(sel)).map(String) : []);
  const mv = (a.vertex_candidates || []).find(v => String(v.id) === String(ablMove[key]));
  const inMove = new Set(mv ? mv.chain.map(String) : []);
  const byM = (u, w) => (mInc(x.stmts[w], m) || 0) - (mInc(x.stmts[u], m) || 0) || ((x.stmts[w].incl || {}).arith || 0) - ((x.stmts[u].incl || {}).arith || 0);
  roots.sort(byM);
  const st = id => a.statements[id];
  const line = id => st(id).line + 1;
  const loopMark = id => st(id).loop ? ` <span class="lp" title="Строка в динамическом цикле: её цена — за n = ${a.n} итераций">↻</span>` : "";
  const pipesOf = row => ["arith", "ls", "v", "t"].filter(p => Math.abs(row.incl[p] || 0) >= 0.01).map(p => `${PIPE[p][0]} ${c1(row.incl[p])}`).join(" · ");
  const partRow = (id, kid) => { const row = x.stmts[id], v = mInc(row, m), n = sub(id).length, ex = st(id).explain;
    return `<tr class="${kid ? "kid" : ""} ${String(sel) === String(id) ? "on" : ""}" data-part="${id}" data-key="${key}"><td class="n">${line(id)}</td>
      <td class="code" title="${esc(st(id).text)}">${kid ? "↳ " : ""}${esc(st(id).text)}</td>
      <td class="small" title="${esc(ex ? ex.text : "")}">${esc(ex ? ex.text : "")}</td><td class="n">${n > 1 ? n : ""}</td>
      <td class="n"><b>${c1(v)}</b>${loopMark(id)}</td><td class="n">${share(v)}</td><td class="small muted">${pipesOf(row)}</td></tr>`; };
  const top = opts.top || 15;
  const rows = roots.slice(0, top).map(id => partRow(id) + (String(sel) === String(id)
    ? (st(id).children || []).filter(k => x.stmts[k] && !x.stmts[k].error).sort(byM).slice(0, 12).map(k => partRow(k, true)).join("") : "")).join("");
  const metricSeg = `<div class="seg" data-metrics="1">${Object.entries(METRICS).filter(([k]) => k === "price" || x.base.pipes[k] != null)
    .map(([k, [t, tip]]) => `<button data-m="${k}" title="${esc(tip)}" class="${k === m ? "on" : ""}">${t}</button>`).join("")}</div>`;
  // candidates for the vertex shader: what moving each saves is its own ablation (the same new varying)
  const cands = (a.vertex_candidates || []).map(v => ({...v, row: x.stmts[v.id]})).sort((u, w) => (mInc(w.row, m) || 0) - (mInc(u.row, m) || 0));
  const moves = cands.length ? `<h3>Можно посчитать в вертексе <span class="muted small" title="Значения, аффинные по varying с коэффициентами из свойств: их можно точно посчитать в вершинном шейдере и передать через Custom Interpolator">${cands.length} · ${refLink("vertex-move", "что это")}</span></h3>
    <table class="cmp parts">${`<colgroup><col style="width:56px"><col style="width:400px"><col style="width:250px"><col style="width:70px"><col style="width:90px"><col style="width:70px"><col style="width:70px"></colgroup>`}
      <tr><th class="n">Строка</th><th title="Значение, которое станет новым varying; клик — его цепочка в коде">Значение</th><th>Что это</th>
      <th class="n" title="Сколько компонент займёт в varyings">Компонент</th>
      <th class="n" title="${esc(METRICS[m][1])}: столько сэкономит пиксельный шейдер (с учётом нового varying)">${esc(METRICS[m][0])}</th>
      <th class="n" title="Доля от цены шейдера">Доля</th><th class="n" title="Строк в цепочке, которая переедет в вертекс">Строк</th></tr>
      ${cands.slice(0, top).map(v => { const val = mInc(v.row, m);
        return `<tr class="${mv && mv.id === v.id ? "on" : ""}" data-move="${v.id}" data-key="${key}"><td class="n">${v.line + 1}</td>
        <td class="code" title="${esc(v.text)}">${esc(v.text)}</td><td class="small">${esc(v.label)}</td><td class="n">${v.width}</td>
        <td class="n ${val > 0 ? "good" : "muted"}"><b>${c1(val)}</b></td><td class="n">${val > 0 ? share(val) : ""}</td><td class="n">${v.chain.length}</td></tr>`; }).join("")}</table>
    ${a.varyings ? `<div class="small muted" title="Mali интерполирует varyings по 4 компоненты; у vec3 и vec2 свободные компоненты можно занять без нового слота">varyings сейчас: ${a.varyings.varyings}, свободных компонент в них: ${a.varyings.free_components}</div>` : ""}` : "";
  const showCode = opts.code !== false || ablCode[key];
  const maxSelf = Math.max(...ids.map(id => mSelf(x.stmts[id], m) || 0), 1e-9);
  const code = !showCode ? "" : a.lines.map(l => { const id = l.stmt, row = id != null ? x.stmts[id] : null, v = mSelf(row, m);
    const w = v ? Math.max(2, 100 * v / maxSelf) : 0;
    const cl = id != null && inPart.has(String(id)) ? (String(id) === String(sel) ? "sel" : "part") : id != null && inMove.has(String(id)) ? "mv" : "";
    return `<tr id="L-${key}-${l.no}" class="${cl}"${id != null ? ` data-part="${id}" data-key="${key}" style="cursor:pointer"` : ""}>
      <td class="no">${l.no}</td><td class="heat">${w ? `<div class="hb ${v < maxSelf / 4 ? "lo" : ""}" style="width:${w}%"></div>` : ""}</td>
      <td class="val">${v ? c1(v) : ""}</td><td class="code">${esc(l.text)}</td></tr>`; }).join("");
  return `<div class="abl"><h3>Самые тяжёлые части <span class="muted small">${esc(c)}, GLES, n = ${a.n} · ${refLink("ablation", "как считается")}</span></h3>
    <div class="tools" style="margin:0 0 6px"><span class="small muted" title="По какому блоку сортировать части и красить строки">Сортировать по</span>${metricSeg}
      <span class="small muted" title="Цена этого шейдера в GLES на ${esc(c)} при n = ${a.n}">из ${c1(baseV)} ${m === "price" ? "циклов цены" : "циклов " + PIPE[m][0]}</span></div>
    <table class="cmp parts">${`<colgroup><col style="width:56px"><col style="width:400px"><col style="width:300px"><col style="width:50px"><col style="width:80px"><col style="width:60px"><col style="width:220px"></colgroup>`}
      <tr><th class="n" title="Строка в коде шейдера">Строка</th><th title="Последняя строка части; клик — её строки в коде и самые дорогие подчасти">Часть</th>
      <th title="Что делает часть: выборки текстур, чтение буферов, sin, деления… (по всем её строкам)">Что внутри</th>
      <th class="n" title="Сколько строк кода в части: строка и всё, что без неё стало бы мёртвым кодом">Строк</th>
      <th class="n" title="${esc(METRICS[m][1])}: насколько упадёт, если убрать часть">${esc(METRICS[m][0])}</th><th class="n" title="Доля от цены шейдера">Доля</th>
      <th title="Насколько упадёт каждый блок, если убрать часть">По блокам</th></tr>${rows}</table>
    ${moves}
    <h3>Код <span class="muted small" title="Полоса и число — собственная цена строки: без строк её части">собственная цена строки · клик — её часть</span></h3>
    ${showCode ? `<div class="codev" id="code-${key}"><table>${code}</table></div>` : `<button class="btn" data-code="${key}">Показать код (${a.lines.length} строк)</button>`}</div>`;
}

// clicks of the ablation blocks: a part, a vertex candidate, the code, the metric
function bindAbl() {
  const scrollTo = (kk, line) => { const row = line && document.getElementById(`L-${kk}-${line}`);
    if (row) { const box = row.closest(".codev"); box.scrollTop = row.offsetTop - box.clientHeight / 2; } };
  document.querySelectorAll("[data-part]").forEach(el => el.onclick = () => {
    const kk = el.dataset.key, id = el.dataset.part;
    ablPart[kk] = String(ablPart[kk]) === id && el.closest(".parts") ? null : id;
    ablMove[kk] = null; ablCode[kk] = true;
    render();
    const a = ABL[kk];
    scrollTo(kk, ablPart[kk] != null && a.statements[ablPart[kk]] ? a.statements[ablPart[kk]].line + 1 : null);
  });
  document.querySelectorAll("[data-move]").forEach(el => el.onclick = () => {
    const kk = el.dataset.key, id = el.dataset.move;
    ablMove[kk] = String(ablMove[kk]) === id ? null : id;
    ablPart[kk] = null; ablCode[kk] = true;
    render();
    const v = (ABL[kk].vertex_candidates || []).find(c => String(c.id) === id);
    scrollTo(kk, v && ablMove[kk] != null ? v.line + 1 : null);
  });
  document.querySelectorAll("[data-code]").forEach(el => el.onclick = () => { ablCode[el.dataset.code] = true; render(); });
  document.querySelectorAll("[data-metrics] button").forEach(b => b.onclick = () => { ablMetric = b.dataset.m; render(); });
}

/* ---------- why the heaviest shaders of a frame are heavy (python -m paretogpu hotspots) ---------- */
function renderHotspots() {
  core = D.core;
  const STAGE_RU = {fragment: "Пиксельный шейдер", vertex: "Вершинный шейдер"};
  const topPart = a => { if (!a || a.error) return null;
    const x = a.by_core[D.core]; if (!x || x.base.error) return null;
    const ids = Object.keys(a.statements).filter(id => x.stmts[id] && !x.stmts[id].error);
    // the costliest part below the shader's output: a root that is not almost the whole shader
    const roots = ids.filter(id => a.statements[id].parent == null).sort((u, w) => (x.stmts[w].price || 0) - (x.stmts[u].price || 0));
    const kids = id => (a.statements[id].children || []).filter(k => x.stmts[k] && !x.stmts[k].error).sort((u, w) => (x.stmts[w].price || 0) - (x.stmts[u].price || 0));
    let id = roots[0];
    while (id != null && x.stmts[id].price > 0.75 * x.base.price && kids(id).length && x.stmts[kids(id)[0]].price > 0.25 * x.base.price) id = kids(id)[0];
    return id == null ? null : {text: a.statements[id].explain.text, line: a.statements[id].line + 1, price: x.stmts[id].price, base: x.base.price};
  };
  const head = `<div class="card"><h1>Почему тяжёлые шейдеры</h1>
    <div class="mode small muted">Снимок <b>${esc(D.snapshot)}</b> · ${esc(D.core)} · цены кадра — ${esc(D.api || "")}, разбор строк — GLES · malioc ${esc(D.malioc || "?")} · расчёт ${when(D.computed_at)}</div>
    ${D.warnings.length ? `<div class="warn"><ul>${D.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
    <p class="small" style="margin:10px 0 0">${refLink("hotspots", "Как читать")} · ${costHelp}</p></div>`;
  const overview = `<div class="card"><h2>Самые дорогие шейдеры кадра</h2><table class="cmp parts">
    <colgroup><col style="width:40px"><col style="width:420px"><col style="width:80px"><col style="width:480px"><col style="width:90px"></colgroup>
    <tr><th class="n">#</th><th>Шейдер · проход</th><th class="n" title="Доля в цене кадра на ${esc(D.core)}">% кадра</th>
    <th title="Самая дорогая часть пиксельного шейдера ниже его выхода и что в ней">Что тяжёлое</th><th class="n" title="Кандидатов на перенос в вертекс">В вертекс</th></tr>
    ${D.shaders.map((it, i) => { const t = topPart((it.ablation || {}).fragment) || topPart((it.ablation || {}).vertex);
      const nm = ((it.ablation || {}).fragment || {}).vertex_candidates;
      return `<tr data-go="hs-${i}"><td class="n">${i + 1}</td><td class="code" title="${esc(it.variant)}">${esc(it.shader)} · ${esc(it.pass || "")}</td>
        <td class="n"><b>${pct(it.share || 0, 1).replace("+", "")}</b></td>
        <td class="small">${t ? `${esc(t.text)} <span class="muted">· строка ${t.line}, ${p0(Math.max(0, t.price) / (t.base || 1))} цены</span>` : `<span class="muted">${esc((((it.ablation || {}).fragment || {}).error) || "—")}</span>`}</td>
        <td class="n">${nm && nm.length ? nm.length : ""}</td></tr>`; }).join("")}</table></div>`;
  const cards = D.shaders.map((it, i) => {
    const pxPrice = it.pixels ? it.fragment / it.pixels : null;
    return `<div class="card" id="hs-${i}"><h2>#${i + 1} ${esc(it.shader)} <span class="muted">· ${esc(it.pass || "")}</span>
        <span class="badge" style="background:var(--chip)">${pct(it.share || 0, 1).replace("+", "")} кадра</span></h2>
      <div class="small">${kws(it.keywords || [])}</div>
      <div class="small muted" style="margin-top:4px">${num(it.events)} событий · ${num(it.pixels)} пикс. · ${num(it.vertices)} верш.${pxPrice != null ? ` · в кадре ${c1(pxPrice)} цикл./пикс. (${esc(D.api || "")})` : ""}</div>
      ${Object.entries(it.ablation || {}).map(([stage, a]) => `<h3 style="margin-top:14px">${STAGE_RU[stage] || stage}</h3>${ablationBlock(`${i}:${stage}`, a, {code: false, top: 8})}`).join("")}</div>`;
  }).join("");
  $("#app").innerHTML = head + overview + cards;
  document.querySelectorAll("[data-go]").forEach(el => { el.style.cursor = "pointer"; el.onclick = () => document.getElementById(el.dataset.go).scrollIntoView({behavior: "smooth"}); });
  bindAbl();
}

function renderMaterial() {
  const M_ = D.m, n = String(selN), k = selPart;
  const stage = k === "px" ? "fragment" : "vertex";
  const looped = M_.passes.some(p => Object.values(PR(p)).some(x => x.looped));
  const head = `<div class="card"><h1>Материал</h1>
    <div class="side"><b>${esc(M_.material)}</b>
      <div class="small muted" style="font-family:var(--mono);word-break:break-all">${esc(M_.path)}</div>
      <div class="small" style="margin-top:4px">${esc(M_.shader)}</div><div class="small" style="margin-top:4px">${kws(M_.keywords)}</div></div>
    <div class="mode small muted">Расчёт ${when(D.computed_at)} · malioc ${esc(D.malioc || "?")} · ${esc(D.project)}</div>
    ${D.warnings.length ? `<div class="warn"><ul>${D.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
    <p class="small" style="margin:10px 0 0">${refLink("ablation", "Как читать")} · ${costHelp}</p></div>`;
  if (!D.cores.length) { $("#app").innerHTML = head; return; }
  const cores = D.cores.length > 1 ? `<div class="seg" id="cores">${D.cores.map(c => `<button data-c="${esc(c)}" class="${c === core ? "on" : ""}">${esc(c)}${c === D.main_core ? " ★" : ""}</button>`).join("")}</div>` : `<b>${esc(core)}</b>`;
  const parts = `<div class="seg" id="parts">${Object.entries(PARTS).map(([kk, [t]]) => `<button data-k="${kk}" class="${kk === selPart ? "on" : ""}">${t}</button>`).join("")}</div>`;
  const apis = (D.apis || [D.api]).length > 1 ? `<div class="seg" id="apis">${D.apis.map(x => `<button data-a="${esc(x)}" class="${x === selApi ? "on" : ""}">${API_NAME[x] || esc(x)}</button>`).join("")}</div>` : "";
  const nsel = looped ? `<span class="small muted">n циклов</span><div class="seg" id="ns">${D.ns.map(v => `<button data-n="${v}" class="${v === selN ? "on" : ""}">${v}</button>`).join("")}</div>` : "";
  const tools = `<div class="card" style="padding:10px 16px"><div class="tools" style="margin:0">${parts}${apis}<span class="small muted" style="margin-left:8px">Ядро</span>${cores}<span style="flex:1"></span>${nsel}</div></div>`;
  const cards = M_.passes.map((p, pi) => {
    const x = PR(p)[core];
    const a = (p.ablation || {})[stage];
    const price = x ? x[k][n] : null;
    const bound = boundTag(x && x[k + "_bound"]);
    const flags = (x && x.flags || []).map(f => `<span class="badge flagbad">${esc(FLAG[f] || f)}</span>`).join(" ");
    const facts = x ? `<div class="kpis"><div class="kpi"><div class="k">${PARTS[k][0]}</div><div class="v">${c1(price)}</div>
        <div class="s">циклов на ${PARTS[k][1]} · ${API_NAME[selApi] || esc(selApi)}${byNs(x, k) ? `, n = ${n}` : ""}</div></div>
      <div class="kpi"><div class="k">Упор</div><div class="v" style="font-size:16px;margin-top:6px">${bound}</div></div>
      <div class="kpi"><div class="k">Регистры</div><div class="v">${c1(k === "px" ? x.px_regs : x.vtx_regs)}</div>${k === "px" && x.px_fp16 != null ? `<div class="s">fp16 ${x.px_fp16}%</div>` : ""}</div></div>
      ${flags ? `<div style="margin-top:8px">${flags}</div>` : ""}` : `<div class="warn">${esc(p.error || "нет цены на этом ядре")}</div>`;
    return `<div class="card"><h2>Проход ${esc(p.pass)}</h2>${facts}
      <div class="small" style="margin-top:8px"><span class="muted" title="Keywords материала + глобальные keywords пайплайна для прохода">Keywords варианта:</span> ${kws(p.keywords)}</div>
      <h3>По конвейерам <span class="muted small">${esc(core)}, ${API_NAME[selApi] || esc(selApi)}</span></h3>${singlePipes(x, k, n)}
      ${ablationBlock(`${pi}:${stage}`, a)}</div>`;
  }).join("");
  $("#app").innerHTML = head + tools + cards;
  document.querySelectorAll("#cores button").forEach(b => b.onclick = () => { core = b.dataset.c; render(); });
  document.querySelectorAll("#ns button").forEach(b => b.onclick = () => { selN = +b.dataset.n; render(); });
  document.querySelectorAll("#parts button").forEach(b => b.onclick = () => { selPart = b.dataset.k; render(); });
  document.querySelectorAll("#apis button").forEach(b => b.onclick = () => { selApi = b.dataset.a; render(); });
  bindAbl();
}

/* ---------- two materials (python -m paretogpu matcompare) ---------- */
let selN = D && D.default_n;
const kws = k => k.length ? k.map(x => `<span class="kwc">${esc(x)}</span>`).join(" ") : `<span class="muted">без keywords</span>`;
const dp = (a, b) => a == null || b == null ? "" : `<span class="${cls(b - a)}">${pct(b - a, a)}</span>`;
const c1 = x => x == null ? "—" : (+x).toFixed(x >= 100 ? 0 : 1);

function matSide(m, tag) {
  return `<div class="side ${tag === "B" ? "b" : ""}"><span class="tag">${tag}</span><b>${esc(m.material)}</b>
    <div class="small muted" style="font-family:var(--mono);word-break:break-all">${esc(m.path)}</div>
    <div class="small" style="margin-top:4px">${esc(m.shader)}</div>
    <div class="small" style="margin-top:4px">${kws(m.keywords)}</div></div>`;
}

let selPart = "px", selApi = D && D.api;
const PR = p => (p && ((p.prices_by_api || {})[selApi] || (selApi === D.api ? p.prices : null))) || {};
const API_NAME = {vulkan: "Vulkan", gles: "GLES"};
const PIPES = [["arith", "A — арифметика"], ["fma", "FMA", 1], ["cvt", "CVT", 1], ["sfu", "SFU", 1],
  ["ls", "LS — память"], ["v", "V — varyings"], ["t", "T — текстуры"]];

const LABEL_W = 210, NUM_W = 96;
const cols = n => `<colgroup><col style="width:${LABEL_W}px">${`<col style="width:${NUM_W}px">`.repeat(n)}</colgroup>`;
// B − A of a price in % of A, coloured: cheaper green, dearer red
const dPct = (u, w) => u == null || w == null ? `<td class="n"></td>` : u === w ? `<td class="n muted">=</td>` : `<td class="n ${cls(w - u)}">${pct(w - u, u)}</td>`;

function pipesTable(xa, xb, k, n) {
  const ga = xa && xa[k + "_pipes"], gb = xb && xb[k + "_pipes"];
  if (!ga && !gb) return "";
  const la = ga && ga.longest[n], lb = gb && gb.longest[n];
  const top = c => { if (!c) return null; const v = ["arith", "ls", "v", "t"].filter(x => c[x] != null).map(x => c[x]); return v.length ? Math.max(...v) : null; };
  const ta = top(la), tb = top(lb);
  const has = key => [la, lb, ga && ga.shortest, gb && gb.shortest, ga && ga.total, gb && gb.total].some(c => c && c[key] != null);
  const v = (c, key, t) => { const x = c && c[key]; if (x == null) return `<td class="n">—</td>`;
    const hot = t != null && Math.abs(x - t) < 1e-6 && ["arith", "ls", "v", "t"].includes(key);
    return `<td class="n">${hot ? `<b class="hot" title="Самый загруженный блок: его циклы и есть цена (упор)">${c1(x)} ●</b>` : c1(x)}</td>`; };
  const d = (u, w) => u == null || w == null ? `<td class="n"></td>` : `<td class="n ${cls(w - u)}">${w === u ? "=" : (w > u ? "+" : "−") + c1(Math.abs(w - u))}</td>`;
  const dep = byNs(xa, k) || byNs(xb, k);
  const notes = [];
  if ((ga && ga.longest_na) || (gb && gb.longest_na)) notes.push(dep
    ? "У шейдера динамические циклы: malioc не считает самый длинный путь, он посчитан с циклами, прогнанными n раз."
    : "malioc не нашёл самый длинный путь: вместо него — «всего», поднятое до короткого пути там, где тот больше.");
  const rows = PIPES.filter(([key]) => has(key)).map(([key, label, sub]) => `<tr${sub ? ` class="subp"` : ""}><td title="${esc(PIPE[key][2])}" style="cursor:help">${sub ? "&nbsp;&nbsp;&nbsp;" : ""}${label}</td>
    ${v(la, key, ta)}${v(lb, key, tb)}${d(la && la[key], lb && lb[key])}
    ${v(ga && ga.shortest, key).replace('<td class="n">', '<td class="n gl">')}${v(gb && gb.shortest, key)}${v(ga && ga.total, key).replace('<td class="n">', '<td class="n gl">')}${v(gb && gb.total, key)}</tr>`).join("");
  return `<h3>По конвейерам <span class="muted small">циклов на ${PARTS[k][1]}, ${esc(core)}, ${API_NAME[selApi] || esc(selApi)}</span></h3>
    <table class="cmp">${cols(7)}<tr><th rowspan="2">Конвейер</th><th class="n grp" colspan="3" title="Самый дорогой путь через шейдер: каждый if идёт по более дорогой ветке. По нему считается цена; ● — самый загруженный блок, его циклы и есть цена">Длинный путь${dep ? ` (n = ${n})` : ""} — цена</th>
      <th class="n grp gl" colspan="2" title="Все if идут по дешёвой ветке">Короткий путь</th><th class="n grp gl" colspan="2" title="Каждая инструкция один раз: обе ветки if, тело цикла один раз. Объём кода, а не время">Всего (весь код)</th></tr>
      <tr><th class="n">A</th><th class="n">B</th><th class="n">B − A</th><th class="n gl">A</th><th class="n">B</th><th class="n gl">A</th><th class="n">B</th></tr>${rows}</table>
    <div class="small" style="margin-top:6px">${notes.length ? `<span class="muted">${notes.join(" ")}</span> ` : ""}${refLink("pipes", "блоки ядра и пути")}</div>`;
}
const PARTS = {px: ["Пиксель", "пиксель"], vtx: ["Вершина", "вершину"]};
// how much cheaper the cheaper one is, of the dearer one's price
const cheaper = (a, b) => a == null || b == null || a === b ? null : {who: b < a ? "B" : "A", by: Math.abs(a - b) / Math.max(a, b)};
// the price of this part changes with n (dynamic loops in this stage)
const byNs = (x, k) => !!x && new Set(D.ns.map(m => x[k][String(m)])).size > 1;
const p0 = x => (100 * x).toFixed(x < 0.1 ? 1 : 0) + "%";

function verdict(pa, pb, k) {
  const xa = pa && PR(pa)[core], xb = pb && PR(pb)[core];
  const n = String(selN), A = esc(D.a.material), B = esc(D.b.material);
  if (!xa || !xb) return `<div class="verdict"><div class="vh">Сравнить нечего: ${xa ? "у B" : "у A"} нет этого прохода на ${esc(core)}.</div></div>`;
  const c = cheaper(xa[k][n], xb[k][n]);
  const head = !c ? `<b>${A}</b> и <b>${B}</b> стоят одинаково`
    : `<span class="good">${c.who === "B" ? B : A}</span> <span class="muted">(${c.who})</span> дешевле <span class="bad">${c.who === "B" ? A : B}</span> <span class="muted">(${c.who === "B" ? "A" : "B"})</span> на <b>${p0(c.by)}</b>`;
  const notes = [];
  const dep = byNs(xa, k) || byNs(xb, k);
  if (dep) {
    const by = D.ns.map(m => [m, cheaper(xa[k][m], xb[k][m])]);
    const wins = w => by.filter(([, x]) => x && x.who === w).map(([m]) => m);
    const wa = wins("A"), wb = wins("B");
    const rng = w => { const v = by.filter(([, x]) => x && x.who === w).map(([, x]) => x.by); return v.length ? `${p0(Math.min(...v))}–${p0(Math.max(...v))}` : ""; };
    if (!wa.length && !wb.length) notes.push("одинаково при любом n");
    else if (!wa.length || !wb.length) notes.push(`при любом n циклов (${wa.length ? "A" : "B"} дешевле на ${rng(wa.length ? "A" : "B")})`);
    else notes.push(`<span class="bad">зависит от n:</span> A дешевле при n = ${wa.join(", ")}, B — при n = ${wb.join(", ")}`);
  } else notes.push("от n не зависит");
  if (D.cores.length > 1) {
    const wins = {A: [], B: [], "=": []};
    for (const cc of D.cores) {
      const u = PR(pa), w = PR(pb);
      const x = u && w && u[cc] && w[cc] ? cheaper(u[cc][k][n], w[cc][k][n]) : undefined;
      if (x !== undefined) wins[x ? x.who : "="].push(cc);
    }
    const tot = wins.A.length + wins.B.length + wins["="].length;
    const w = c ? c.who : null;
    notes.push(!w && wins["="].length === tot ? `поровну на всех ${tot} ядрах` : w && wins[w].length === tot ? `на всех ${tot} ядрах`
      : `ядра: ${["A", "B"].filter(x => wins[x].length).map(x => `${x} дешевле на ${wins[x].map(esc).join(", ")}`).join("; ")}${wins["="].length ? `; поровну на ${wins["="].map(esc).join(", ")}` : ""}`);
  }
  return `<div class="verdict ${c ? (c.who === "B" ? "vb" : "va") : ""}"><div class="vh">${head}</div>
    <div class="small muted">${PARTS[k][0].toLowerCase()} на ${esc(core)}${(D.apis || []).length > 1 ? ", " + (API_NAME[selApi] || esc(selApi)) : ""}${dep ? `, n = ${n}` : ""}: ${c1(xa[k][n])} против ${c1(xb[k][n])} циклов · ${notes.join(" · ")}</div></div>`;
}

function renderMaterials() {
  const pairs = D.pairs.map(([i, j]) => [i == null ? null : D.a.passes[i], j == null ? null : D.b.passes[j]]);
  const looped = pairs.some(pp => pp.some(p => p && Object.values(PR(p)).some(x => x.looped)));
  const A = esc(D.a.material), B = esc(D.b.material);
  const head = `<div class="card"><h1>Сравнение материалов</h1>
    <div class="ab">${matSide(D.a, "A")}<div class="arrow">→</div>${matSide(D.b, "B")}</div>
    <div class="mode small muted">Расчёт ${when(D.computed_at)} · ${esc(D.api)} · malioc ${esc(D.malioc || "?")} · ${esc(D.project)}</div>
    ${D.warnings.length ? `<div class="warn"><ul>${D.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
    <p class="small" style="margin:10px 0 0">${refLink("compare-materials", "Как читать сравнение")} · ${costHelp}</p></div>`;
  if (!D.cores.length) { $("#app").innerHTML = head; return; }
  const cores = D.cores.length > 1 ? `<div class="seg" id="cores">${D.cores.map(c => `<button data-c="${esc(c)}" class="${c === core ? "on" : ""}">${esc(c)}${c === D.main_core ? " ★" : ""}</button>`).join("")}</div>` : `<b>${esc(core)}</b>`;
  const parts = `<div class="seg" id="parts">${Object.entries(PARTS).map(([k, [t]]) => `<button data-k="${k}" class="${k === selPart ? "on" : ""}">${t}</button>`).join("")}</div>`;
  const apis = (D.apis || [D.api]).length > 1 ? `<div class="seg" id="apis">${D.apis.map(x => `<button data-a="${esc(x)}" class="${x === selApi ? "on" : ""}">${API_NAME[x] || esc(x)}</button>`).join("")}</div>` : "";
  const nsel = looped ? `<span class="small muted">n циклов</span><div class="seg" id="ns">${D.ns.map(n => `<button data-n="${n}" class="${n === selN ? "on" : ""}">${n}</button>`).join("")}</div>` : "";
  const tools = `<div class="card" style="padding:10px 16px"><div class="tools" style="margin:0">${parts}${apis}<span class="small muted" style="margin-left:8px">Ядро</span>${cores}<span style="flex:1"></span>${nsel}</div></div>`;
  const n = String(selN), k = selPart;
  const cell = (v, other) => `<td class="n ${v != null && other != null && v < other ? "good" : ""}">${v != null && other != null && v < other ? `<b>${c1(v)}</b>` : c1(v)}</td>`;
  const th = `<th class="n" title="${A}">A</th><th class="n" title="${B}">B</th><th class="n">B − A</th>`;
  const cards = pairs.map(([pa, pb]) => {
    const xa = pa && PR(pa)[core], xb = pb && PR(pb)[core];
    const name = pa && pb && pa.pass !== pb.pass ? `${esc(pa.pass)} ↔ ${esc(pb.pass)}` : esc((pa || pb).pass);
    const byN = byNs(xa, k) || byNs(xb, k) ? `<h3>${PARTS[k][0]} при разном n <span class="muted small">циклов на ${PARTS[k][1]}, ${esc(core)}, ${API_NAME[selApi] || esc(selApi)}</span></h3>
      <table class="cmp">${cols(3)}<tr><th>n циклов</th>${th}</tr>
      ${D.ns.map(m => { const u = xa && xa[k][String(m)], w = xb && xb[k][String(m)];
        return `<tr${m === selN ? ` class="sel"` : ""}><td><b>${m}</b></td>${cell(u, w)}${cell(w, u)}${dPct(u, w)}</tr>`; }).join("")}</table>` : "";
    const allCores = D.cores.length > 1 ? `<h3>${PARTS[k][0]} на всех ядрах <span class="muted small">${byNs(xa, k) || byNs(xb, k) ? `n = ${n}, ` : ""}циклов на ${PARTS[k][1]}</span></h3>
      <table class="cmp">${cols(3)}<tr><th>Ядро</th>${th}</tr>
      ${D.cores.map(c => { const u = pa && PR(pa)[c] && PR(pa)[c][k][n], w = pb && PR(pb)[c] && PR(pb)[c][k][n];
        return `<tr${c === core ? ` class="sel"` : ""}><td>${esc(c)}</td>${cell(u, w)}${cell(w, u)}${dPct(u, w)}</tr>`; }).join("")}</table>` : "";
    const a = xa || {}, b = xb || {};
    const better = (u, w, lowIsGood) => u == null || w == null || u === w ? ["", ""] : (lowIsGood ? w < u : w > u) ? ["", "good"] : ["good", ""];
    const line = (label, key, f = v => v ?? "—", low) => {
      const [ca, cb] = low === undefined ? ["", ""] : better(a[key], b[key], low);
      return `<tr><td>${label}</td><td class="${ca}">${f(a[key])}</td><td class="${cb}">${f(b[key])}</td></tr>`;
    };
    const bound = boundTag;
    const flags = fs => (fs || []).map(f => `<span class="badge flagbad">${esc(FLAG[f] || f)}</span>`).join(" ") || "—";
    const pxRows = `${line("Регистры", "px_regs", undefined, true)}${line("fp16, %", "px_fp16", undefined, false)}${line("Упор (самый загруженный блок)", "px_bound", bound)}
      ${line("Динамические циклы", "looped", v => v == null ? "—" : v ? "есть: цена зависит от n" : "нет")}
      <tr><td>Флаги</td><td>${xa ? flags(a.flags) : "—"}</td><td>${xb ? flags(b.flags) : "—"}</td></tr>`;
    const vtxRows = `${line("Регистры", "vtx_regs", undefined, true)}${line("Упор (самый загруженный блок)", "vtx_bound", bound)}`;
    const chars = `<h3>Характеристики шейдера ${k === "px" ? "пикселя" : "вершины"} <span class="muted small">зелёным — у кого лучше</span></h3>
      <table class="chars"><colgroup><col style="width:${LABEL_W}px"><col><col></colgroup><tr><th></th><th>A · ${A}</th><th>B · ${B}</th></tr>
      <tr><td>Keywords варианта</td><td>${pa ? kws(pa.keywords) : "—"}</td><td>${pb ? kws(pb.keywords) : "—"}</td></tr>
      ${k === "px" ? pxRows : vtxRows}
      ${(pa && pa.error) || (pb && pb.error) ? `<tr><td>Нет цены</td><td class="bad">${esc(pa && pa.error || "")}</td><td class="bad">${esc(pb && pb.error || "")}</td></tr>` : ""}</table>`;
    return `<div class="card"><h2>Проход ${name}</h2>${verdict(pa, pb, k)}${byN}${pipesTable(xa, xb, k, n)}${allCores}${chars}</div>`;
  }).join("");
  $("#app").innerHTML = head + tools + cards;
  document.querySelectorAll("#cores button").forEach(b => b.onclick = () => { core = b.dataset.c; render(); });
  document.querySelectorAll("#ns button").forEach(b => b.onclick = () => { selN = +b.dataset.n; render(); });
  document.querySelectorAll("#apis button").forEach(b => b.onclick = () => { selApi = b.dataset.a; render(); });
  document.querySelectorAll("#parts button").forEach(b => b.onclick = () => { selPart = b.dataset.k; render(); });
}
